<title>სამი ხაზი</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700&family=Noto+Serif+Georgian:wght@700;800&display=swap">
<style>
/* „სამი ხაზი“ — ბარათის თამაშის ბრაუზერის ვერსია. ზემოთ მოწინააღმდეგის შტაბი, შუაში ველი (3 ხაზი × 5 ადგილი), ქვემოთ შენი შტაბი და ხელი.
   ფერები — სანგრის ტალახი და ბრინჯაო (იგივე, რაც „სოფლის ფრონტში“); თამაშს მხოლოდ მუქი თემა აქვს. */
:root {
  --mud: #241f19; --mud-2: #322a21; --mud-3: #3d3428; --paper: #e9dfc8; --ink: #f1e8d6; --muted: #b3a58b;
  --bronze: #c8913e; --rust: #c0563d; --moss: #8a9a5b; --line: #54473a; --nml: #4a4030;
  --me: #c8913e; --foe: #b4462f;
  --display: "Noto Serif Georgian", "DejaVu Serif", Georgia, serif;
  --body: "Noto Sans Georgian", "DejaVu Sans", system-ui, sans-serif;
  --tok: clamp(46px, 7.4vw, 78px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--mud); }
body { background: var(--mud); color: var(--ink); font-family: var(--body); font-size: 14px; }
button { font: inherit; color: inherit; }
.app { max-width: 1280px; margin: 0 auto; padding-block: 8px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 8px;
  grid-template-columns: minmax(0, 1fr) 300px; grid-template-areas: "top top" "board side" "hand side"; }
@media (max-width: 900px) { .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "board" "hand" "side"; } }
header { grid-area: top; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; }
h1 { font-family: var(--display); font-size: 1.15rem; margin: 0; }
h1 small { font-family: var(--body); font-weight: 400; color: var(--muted); font-size: .78rem; margin-left: 6px; }
.tools { display: flex; gap: 6px; align-items: center; }
.btn { background: var(--mud-2); border: 1px solid var(--line); border-radius: 5px; padding: 6px 11px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--bronze); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { border-color: var(--bronze); color: var(--bronze); font-weight: 700; }
:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.lang button { border: 0; background: transparent; padding: 5px 9px; cursor: pointer; font-size: .78rem; }
.lang button[aria-pressed="true"] { background: var(--mud-3); font-weight: 700; color: var(--bronze); }

/* ველი */
.boardwrap { grid-area: board; display: grid; gap: 6px; }
.hq { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--mud-2); }
.hq.foe { border-color: #6b3a2c; } .hq.me { border-color: #6b5530; }
.hq b.name { font-family: var(--display); }
.hq .stat { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .82rem; }
.hq .stat strong { color: var(--ink); font-size: .95rem; }
.hq .nerve { display: inline-flex; align-items: center; gap: 6px; }
.hq .bar { width: 90px; height: 8px; background: #1b1713; border-radius: 4px; overflow: hidden; }
.hq .bar i { display: block; height: 100%; background: var(--moss); }
.hq.target { outline: 2px dashed var(--rust); cursor: pointer; }
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.cell { position: relative; min-height: calc(var(--tok) * 4 / 3 + 12px); padding: 5px; border-radius: 5px; background: var(--mud-2); border: 1px solid transparent;
  display: flex; flex-wrap: wrap; gap: 4px; align-content: center; justify-content: center; }
.cell.trench { background: #2d271f; background-image: repeating-linear-gradient(135deg, transparent 0 8px, rgba(0,0,0,.12) 8px 10px); }
.cell.nml { background: var(--nml); min-height: calc(var(--tok) * 8 / 3 + 18px); flex-direction: column; flex-wrap: nowrap; justify-content: space-between; }
.cell.nml .half { display: flex; gap: 4px; justify-content: center; min-height: calc(var(--tok) * 4 / 3); }
.cell.nml.held-me { box-shadow: inset 0 -3px 0 var(--me); } .cell.nml.held-foe { box-shadow: inset 0 3px 0 var(--foe); }
.cell .lbl { position: absolute; left: 6px; top: 3px; font-size: .62rem; color: var(--muted); letter-spacing: .04em; pointer-events: none; }
.cell.hl { border-color: var(--bronze); background-color: #4b3d26; cursor: pointer; }
.cell.hl::after { content: "+"; position: absolute; right: 6px; top: 1px; color: var(--bronze); font-weight: 700; }
.fort { position: absolute; right: 4px; bottom: 3px; font-size: .62rem; padding: 1px 5px; border-radius: 3px; background: #1b1713; border: 1px solid var(--line); max-width: 92%;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fort.mine { border-color: #6b5530; } .fort.foe { border-color: #6b3a2c; }
.fort.target { outline: 2px solid var(--rust); cursor: pointer; }
@media (max-width: 600px) {
  .cell .lbl { display: none; }
  .fort { position: static; flex-basis: 100%; text-align: center; order: -1; }
  .cell.nml .half { min-height: calc(var(--tok) * 4 / 3 - 4px); }
}
.lanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; text-align: center; font-size: .66rem; color: var(--muted); }

/* იუნიტის ნიშანი ველზე */
.tok { position: relative; width: var(--tok); aspect-ratio: 3 / 4; border-radius: 5px; border: 2px solid var(--me); padding: 0; cursor: pointer;
  background-color: var(--mud-3); background-repeat: no-repeat; overflow: hidden; }
.tok.foe { border-color: var(--foe); }
.tok .a, .tok .h { position: absolute; bottom: 2px; min-width: 18px; padding: 0 3px; border-radius: 3px; font-weight: 700; font-size: .72rem; line-height: 1.35; font-variant-numeric: tabular-nums; }
.tok .a { left: 2px; background: #7a1f1a; } .tok .h { right: 2px; background: #2f5d50; }
.tok .h.hurt { background: #8a5a1a; }
.tok .st { position: absolute; top: 2px; left: 2px; right: 2px; display: flex; gap: 2px; flex-wrap: wrap; }
.tok .st i { font-style: normal; font-size: .58rem; padding: 0 3px; border-radius: 3px; background: rgba(20,16,12,.85); line-height: 1.4; }
.tok.ready { box-shadow: 0 0 0 2px var(--mud), 0 0 0 4px #e7c46b; }
.tok.spent { filter: saturate(.35) brightness(.75); }
.tok.sel { box-shadow: 0 0 0 2px var(--mud), 0 0 0 4px #fff; }
.tok.target { box-shadow: 0 0 0 2px var(--mud), 0 0 0 4px var(--rust); }
.tok.pick { box-shadow: 0 0 0 2px var(--mud), 0 0 0 4px var(--moss); }
.tok.camo { opacity: .6; }
.tok.hit { animation: hit .45s ease-out; }
@keyframes hit { 0% { transform: translateX(0); filter: brightness(2); } 30% { transform: translateX(-3px); } 60% { transform: translateX(3px); } 100% { transform: none; } }
.float { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 1.15rem; color: #ffd9c9; text-shadow: 0 1px 3px #000;
  pointer-events: none; animation: rise .9s ease-out forwards; }
@keyframes rise { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-18px); } }

/* ხელი */
.handwrap { grid-area: hand; display: grid; gap: 6px; }
.bar2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.supply { display: flex; gap: 4px; align-items: center; }
.supply i { width: 14px; height: 14px; border-radius: 50%; background: var(--bronze); display: inline-block; }
.supply i.off { background: transparent; border: 1px solid var(--line); }
.hint { color: var(--muted); font-size: .8rem; min-height: 1.2em; }
.hand { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; }
.card { flex: none; width: 128px; border-radius: 7px; border: 2px solid var(--line); background: var(--paper); color: #1d1a16; padding: 0; cursor: pointer; text-align: left;
  display: flex; flex-direction: column; overflow: hidden; }
.card .art { height: 92px; background-color: #b9ad9c; background-repeat: no-repeat; position: relative; }
.card .cost { position: absolute; left: 4px; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--bronze); color: #1d1a16; display: grid; place-items: center; font-weight: 800; font-size: .85rem; }
.card .nm { font-family: var(--display); font-weight: 700; font-size: .78rem; line-height: 1.15; padding: 4px 6px 0; }
.card .sub { font-size: .64rem; color: #6a6158; padding: 1px 6px; }
.card .kw { font-size: .64rem; padding: 0 6px; color: #3d362e; }
.card .ft { margin-top: auto; display: flex; justify-content: space-between; padding: 3px 6px 5px; font-weight: 800; font-size: .85rem; }
.card .ft .a { color: #7a1f1a; } .card .ft .h { color: #2f5d50; }
.card.can { border-color: var(--bronze); }
.card.no { opacity: .55; }
.card.sel { border-color: #fff; transform: translateY(-4px); }

/* გვერდითი პანელი */
.side { grid-area: side; display: grid; gap: 8px; align-content: start; }
.panel { border: 1px solid var(--line); border-radius: 6px; background: var(--mud-2); padding: 10px; }
.panel h2 { font-family: var(--display); font-size: 1rem; margin: 0 0 6px; }
.detail .big { width: 100%; aspect-ratio: 2 / 3; max-height: 260px; border-radius: 5px; background-color: var(--mud-3); background-repeat: no-repeat; margin-bottom: 8px; }
@media (max-width: 900px) { .detail .big { max-height: 180px; width: 120px; float: left; margin-right: 10px; } }
.detail p { margin: 4px 0; font-size: .85rem; }
.detail .meta { color: var(--muted); font-size: .78rem; }
.detail ul { margin: 4px 0 0; padding-left: 18px; font-size: .8rem; }
.detail .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; clear: both; }
.log { max-height: 240px; overflow-y: auto; font-size: .78rem; display: grid; gap: 3px; }
.log div { color: var(--muted); } .log div.me { color: #e6cf9f; } .log div.foe { color: #e2a594; } .log div.sys { color: var(--ink); font-weight: 600; }

/* ეკრანები */
.overlay { position: fixed; inset: 0; background: rgba(18, 14, 10, .86); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 10; overflow-y: auto; }
.overlay[hidden] { display: none; }
.overlay[data-kind="pass"] { background: var(--mud); }
.dialog { width: min(640px, 100%); background: var(--mud-2); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: grid; gap: 12px; }
.dialog h2 { font-family: var(--display); margin: 0; font-size: 1.4rem; color: var(--bronze); }
.dialog p { margin: 0; line-height: 1.5; }
.dialog label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
.dialog select { font: inherit; background: var(--mud); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 7px; }
.dialog .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
@media (max-width: 560px) { .dialog .row { grid-template-columns: 1fr; } }
.dialog .deck { font-size: .78rem; color: var(--muted); line-height: 1.45; }
.dialog .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.rules { font-size: .88rem; line-height: 1.5; } .rules h3 { margin: 10px 0 2px; font-size: .95rem; color: var(--bronze); } .rules ul { margin: 0; padding-left: 18px; }
@media (prefers-reduced-motion: reduce) { .tok.hit, .float { animation: none; } }
</style>
<div class="app">
  <header>
    <h1 id="title"></h1>
    <div class="tools">
      <button class="btn" id="bRules" type="button"></button>
      <button class="btn" id="bNew" type="button"></button>
      <div class="lang" role="group" aria-label="ენა / Language"><button type="button" data-lang="ka">ქარ</button><button type="button" data-lang="en">EN</button></div>
    </div>
  </header>
  <section class="boardwrap">
    <div class="hq foe" id="hqFoe"></div>
    <div class="board" id="board"></div>
    <div class="lanes" id="lanes"></div>
    <div class="hq me" id="hqMe"></div>
  </section>
  <section class="handwrap">
    <div class="bar2"><div class="hint" id="hint" aria-live="polite"></div><button class="btn primary" id="bEnd" type="button"></button></div>
    <div class="hand" id="hand"></div>
  </section>
  <aside class="side">
    <div class="panel detail" id="detail"></div>
    <div class="panel"><h2 id="logH"></h2><div class="log" id="log" aria-live="polite"></div></div>
  </aside>
</div>
<div class="overlay" id="ov" hidden><div class="dialog" id="dlg" role="dialog" aria-modal="true"></div></div>
<script src="data.js"></script>
<script>
"use strict";
const D = window.CG;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let LANG = "ka";
try { LANG = localStorage.getItem("cg-lang") || "ka"; } catch (e) {}
const t = (ka, en) => LANG === "en" ? en : ka;
const nm = c => LANG === "en" ? c.en : c.ka;
const KWN = k => D.kw[k] ? (LANG === "en" ? D.kw[k].en : D.kw[k].ka) : k;
const KWR = k => D.kw[k] ? (LANG === "en" ? D.kw[k].ren : D.kw[k].rka) : "";
const BIG = new Set(["IV", "IV+", "V"]);
const KIND = { "ნაგებობა": "structure", "ბრძანება": "order", "მარაგი": "supply" };
const KINDN = { structure: ["ნაგებობა", "Structure"], order: ["ბრძანება", "Order"], supply: ["მარაგი", "Supply"], unit: ["იუნიტი", "Unit"] };
const POSN = { rear: ["ზურგი", "rear"], trench: ["სანგარი", "trench"], nml: ["ნეიტრალური ზოლი", "No Man's Land"] };
const LANEN = [["მარცხენა ფლანგი", "Left flank"], ["ცენტრი", "Centre"], ["მარჯვენა ფლანგი", "Right flank"]];
const sprite = a => a ? `background-image:url(${a.s});background-size:${a.c * 100}% ${a.r * 100}%;background-position:${a.c > 1 ? a.x / (a.c - 1) * 100 : 0}% ${a.r > 1 ? a.y / (a.r - 1) * 100 : 0}%` : "";
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function cardOf(id) {
  if (D.units[id]) return { id, type: "unit", ...D.units[id] };
  const c = D.common[id];
  return { id, type: KIND[c.kind] || "order", ...c };
}
const cname = c => nm(c);
const ctext = c => c.type === "unit" ? "" : (LANG === "en" ? c.ten : c.tka);
const fname = f => nm(D.factions[f]);

// ---------- თამაში ----------
let G = null, SEL = null, BUSY = false, UID = 0, SIM = false;   // SIM — კომპიუტერი სვლას ასლზე ცდის: ჟურნალი, ეფექტები და ეკრანები გამორთულია

function newGame(opt) {
  const mk = (fid, ai) => {
    const deck = [];
    const s = D.starter[fid];
    for (const [id, n] of Object.entries(s.units)) for (let i = 0; i < n; i++) deck.push(id);
    for (const [id, n] of Object.entries(s.common)) for (let i = 0; i < n; i++) deck.push(id);
    return { fid, ai, deck: shuffle(deck), hand: [], hq: 20, bank: 0, porters: 0, avail: 0, fallen: 0 };
  };
  G = { p: [mk(opt.me, false), mk(opt.foe, opt.mode === "ai")], mode: opt.mode, units: [], forts: {}, volley: {}, turn: 0, cur: opt.first, over: null, log: [] };
  for (const P of G.p) for (let i = 0; i < 5; i++) P.hand.push(P.deck.pop());
  G.p[1 - opt.first].hand.push(G.p[1 - opt.first].deck.pop());
  G.p[1 - opt.first].bank = 2;   // მეორე მოთამაშის კომპენსაცია: +1 ბარათი და პირველ სვლაზე +2 მარაგი
  G.p[1].level = opt.level || "hard";   // კომპიუტერის სიძლიერე: hard — strongAction, easy — aiAction
  SEL = null;
  log(() => t(`${fname(opt.me)} ${fname(opt.foe)}-ის წინააღმდეგ. იწყებს: ${fname(G.p[opt.first].fid)}.`, `${fname(opt.me)} against ${fname(opt.foe)}. ${fname(G.p[opt.first].fid)} goes first.`), "sys");
  startTurn();
}

const viewer = () => G.mode === "hot" ? G.cur : 0;
const alive = () => G.units.filter(u => u.hp > 0);
const at = (lane, o, pos) => G.units.filter(u => u.hp > 0 && u.lane === lane && u.o === o && u.pos === pos);
const fort = (lane, o) => G.forts[lane + ":" + o];
const has = (u, k) => u.kw.includes(k);
const absPos = u => u.o === 0 ? { rear: 0, trench: 1, nml: 2 }[u.pos] : { rear: 4, trench: 3, nml: 2 }[u.pos];
const fortAbs = f => f.o === 0 ? 1 : 3;
const nmlCtrl = o => [0, 1, 2].filter(l => at(l, o, "nml").length && !at(l, 1 - o, "nml").length).length;
const isSup = u => u.supTurn === G.turn;
const leaderBonus = u => G.units.some(x => x !== u && x.hp > 0 && x.o === u.o && x.lane === u.lane && has(x, "leader")) ? 1 : 0;

function log(msg, cls) { if (SIM) return; G.log.push([msg, cls || (G.cur === viewer() ? "me" : "foe")]); if (G.log.length > 80) G.log.shift(); }

function startTurn() {
  const p = G.cur, P = G.p[p];
  G.turn++;
  G.volley = {};
  if (nmlCtrl(p) === 3) return win(p, "break");
  for (const u of G.units.filter(u => u.o === p && u.hp > 0)) {
    if (u.burn) { u.hp -= 1; u.burn = false; log(() => t(`${cname(u.c)} იწვის (−1).`, `${cname(u.c)} burns (−1).`)); }
    if (has(u, "regen") && u.hp > 0 && u.hp < u.max) u.hp = Math.min(u.max, u.hp + 1);
    Object.assign(u, { moved: false, acted: false, fresh: false, noAtk: false, camo: false, raid: false });
  }
  cleanup();
  if (P.deck.length) P.hand.push(P.deck.pop());
  else { P.hq -= 2; log(() => t("დასტა ამოიწურა: შტაბი −2 ნებისყოფა.", "Deck is empty: HQ loses 2 nerve.")); if (P.hq <= 0) return win(1 - p, "hq"); }
  P.avail = 3 + Math.min(P.porters, 3) + nmlCtrl(p) + P.bank;
  P.bank = 0;
  const tn = G.turn, av = P.avail;
  log(() => t(`— სვლა ${tn}: ${fname(P.fid)} (მარაგი ${av})`, `— Turn ${tn}: ${fname(P.fid)} (supply ${av})`), "sys");
  SEL = null;
  render();
  if (P.ai) { BUSY = true; setTimeout(aiStep, 650); }
  else if (G.mode === "hot") passScreen();
}

function endTurn() {
  const p = G.cur, P = G.p[p];
  for (const f of Object.values(G.forts)) {
    if (f.o !== p || !f.atk) continue;
    const pool = f.id === "nest" ? [...at(f.lane, 1 - p, "nml"), ...at(f.lane, 1 - p, "trench")] : alive().filter(u => u.o !== p && u.lane === f.lane);
    const ts = pool.filter(u => !u.camo);
    if (!ts.length) continue;
    const x = ts.reduce((a, b) => b.hp < a.hp ? b : a);
    const d = dmg({ kw: f.id === "nest" ? ["suppress"] : [], o: p }, x, f.atk);
    log(() => t(`${cname(cardOf(f.id))} ესვრის: ${cname(x.c)} −${d}.`, `${cname(cardOf(f.id))} fires: ${cname(x.c)} −${d}.`));
  }
  for (const h of G.units.filter(u => u.o === p && u.hp > 0 && has(u, "healer"))) {
    const hurt = G.units.filter(u => u.o === p && u.hp > 0 && u.lane === h.lane && u.hp < u.max);
    if (hurt.length) { const x = hurt.reduce((a, b) => b.hp < a.hp ? b : a); x.hp = Math.min(x.max, x.hp + 2); }
  }
  cleanup();
  P.bank = Math.min(3, Math.max(0, P.avail));
  P.avail = 0;
  if (G.over) return;
  G.cur = 1 - p;
  startTurn();
}

function win(p, how) {

  if (SIM) return;
  log(() => how === "break" ? t(`გარღვევა! ${fname(G.p[p].fid)} სამივე ნეიტრალურ ზოლს აკონტროლებს.`, `Breakthrough! ${fname(G.p[p].fid)} holds No Man's Land on all three lines.`)
    : t(`${fname(G.p[1 - p].fid)}-ის შტაბი დაეცა.`, `${fname(G.p[1 - p].fid)}: the HQ has fallen.`), "sys");

function cleanup() {
  for (const u of G.units) if (u.hp <= 0 && !u.dead) { u.dead = true; G.p[u.o].fallen++; log(() => t(`${cname(u.c)} დაეცა.`, `${cname(u.c)} has fallen.`), u.o === viewer() ? "foe" : "me"); }
  G.units = G.units.filter(u => u.hp > 0);
  for (const [k, f] of Object.entries(G.forts)) if (f.hp !== null && f.hp <= 0) { delete G.forts[k]; log(() => t(`${cname(cardOf(f.id))} დაინგრა.`, `${cname(cardOf(f.id))} was destroyed.`)); }
}

// ზიანი: შეტევა + მონადირე/საზენიტო; ფარი −1; თხრილი −1 (თუ მტვრევა არ არის); მინ. 1
function calc(src, x, base) {

}

function canAttack(u) {

}
// სამიზნეები: [{k:"u",u}] | [{k:"f",f}] | [{k:"hq"}]
function targets(u) {

  const melee = x => !has(u, "long") && Math.abs(absPos(u) - absPos(x)) <= 1;
  if (has(u, "fly")) {
    alive().filter(x => x.o === e && !x.camo).forEach(x => out.push({ k: "u", u: x }));
    [0, 1, 2].forEach(l => { const f = hpFort(l); if (f) out.push({ k: "f", f }); });
  } else if (u.pos === "rear" && !has(u, "long")) {
    // ზურგიდან მხოლოდ „შორი“ ურტყამს
  } else if (has(u, "long")) {

      if (f && f.id === "palisade" && !has(u, "breaker")) { xs = [{ k: "f", f }]; }

}

function attack(u, tg) {
  const e = 1 - u.o, base = u.atk + leaderBonus(u) + (G.volley[u.o + ":" + u.lane] ? 1 : 0);
  u.acted = true;
  if (tg.k === "hq") {

    log(() => t(`${cname(u.c)} ურტყამს შტაბს: −${base} ნებისყოფა.`, `${cname(u.c)} strikes the HQ: −${base} nerve.`));
    FXHQ.push([e, base]);
    if (G.p[e].hq <= 0) return win(u.o, "hq");
  } else if (tg.k === "f") {
    const a = Math.max(1, base);
    tg.f.hp -= a;
    log(() => t(`${cname(u.c)} ურტყამს: ${cname(cardOf(tg.f.id))} −${a}.`, `${cname(u.c)} hits ${cname(cardOf(tg.f.id))} −${a}.`));
  } else {
    const x = tg.u, a = dmg(u, x, base);
    const melee = !has(u, "long") && !has(u, "fly") && Math.abs(absPos(u) - absPos(x)) <= 1;
    const b = x.hp > 0 && melee && !has(u, "suppress") && !isSup(x) ? dmg(x, u, x.atk + leaderBonus(x)) : null;
    log(() => `${cname(u.c)} → ${cname(x.c)} −${a}` + (b !== null ? t(`; პასუხი −${b}`, `; counter −${b}`) : "") + ".");

}

function moves(u) {
  if (u.o !== G.cur || u.moved || u.acted || u.fresh) return [];   // ახლა ჩამოსული ამ სვლაზე არ მოძრაობს
  const i = ["rear", "trench", "nml"].indexOf(u.pos), out = [];
  for (const j of [i + 1, i - 1]) {

}
function move(u, pos) {

}

// ხელიდან გათამაშება: რა სამიზნე სჭირდება
function needs(c) {

}

  } else if (c.type === "structure") {
    for (const l of [0, 1, 2]) if (!fort(l, p)) out.push([l, "trench"]);

}

  if (c.id === "raid") return own.filter(u => u.pos === "trench" && at(u.lane, p, "nml").length < 2);
  if (c.id === "hospital") return own.filter(u => u.hp < u.max);
  if (c.id === "camo") return own.filter(u => !u.camo);

}
function playable(p, c) {

  if (n === "own") return legalOwn(p, c).length > 0;

}
function play(p, hi, tg) {
  const P = G.p[p], c = cardOf(P.hand[hi]);
  if (!playable(p, c)) return false;
  P.avail -= c.cost;
  P.hand.splice(hi, 1);
  if (c.type === "unit") {
    const [lane, pos] = tg;
    const u = { id: ++UID, c, o: p, lane, pos, hp: c.hp, max: c.hp, atk: c.atk, kw: c.kw, fresh: true, moved: false, acted: false, supTurn: null, burn: false, camo: false, noAtk: false };
    if (pos === "nml") { const w = fort(lane, 1 - p); if (w && w.id === "wire") u.noAtk = true; }
    G.units.push(u);
    if (has(u, "digger") && !fort(lane, p)) G.forts[lane + ":" + p] = { id: "trench", o: p, lane, hp: null, atk: 0 };
    log(() => t(`${cname(c)} ჩამოვიდა (${LANEN[lane][0]}, ${POSN[pos][0]}).`, `${cname(c)} deployed (${LANEN[lane][1]}, ${POSN[pos][1]}).`));
  } else if (c.type === "structure") {
    const lane = tg[0];
    G.forts[lane + ":" + p] = { id: c.id, o: p, lane, hp: c.id === "palisade" ? 4 : (c.hp ?? null), atk: c.atk || 0 };
    log(() => t(`${cname(c)} აშენდა (${LANEN[lane][0]}).`, `${cname(c)} built (${LANEN[lane][1]}).`));
  } else {
    const e = 1 - p;
    switch (c.id) {
      case "porter": P.porters++; break;
      case "recon": for (let i = 0; i < 2; i++) if (P.deck.length) P.hand.push(P.deck.pop()); break;
      case "train": P.avail += 4; break;
      case "barrage": for (const x of at(tg, e, "trench")) { x.hp -= 2; if (!SIM) FX.push([x.id, 2]); } break;
      case "gas": for (const x of alive().filter(x => x.lane === tg && !has(x, "gas_mask"))) { x.hp -= 1; if (!SIM) FX.push([x.id, 1]); } break;
      case "volley": G.volley[p + ":" + tg] = true; break;
      case "hospital": tg.hp = Math.min(tg.max, tg.hp + 4); break;
      case "camo": tg.camo = true; break;
      case "raid": tg.pos = "nml"; tg.raid = true; tg.moved = true; { const w = fort(tg.lane, e); if (w && w.id === "wire") tg.noAtk = true; } break;
    }

    log(() => `${cname(c)}${where()}.`);
    cleanup();
  }
  return true;
}

// ---------- კომპიუტერი ----------
function aiStep() {
  if (!G || G.over) return;
  const p = G.cur;
  const act = G.p[p].level === "easy" ? aiAction(p) : strongAction(p);
  if (act) { act(); render(); if (G.over) return; setTimeout(aiStep, 520); }
  else { BUSY = false; endTurn(); }
}
function laneScore(p, l) { return alive().filter(x => x.lane === l && x.o !== p).reduce((a, x) => a + x.atk, 0) - alive().filter(x => x.lane === l && x.o === p).reduce((a, x) => a + x.atk, 0); }
function pickTarget(u, ts) {
  if (ts.some(x => x.k === "hq")) return ts.find(x => x.k === "hq");
  const base = u.atk + leaderBonus(u) + (G.volley[u.o + ":" + u.lane] ? 1 : 0);
  const us = ts.filter(x => x.k === "u");
  const kill = us.filter(x => calc(u, x.u, base) >= x.u.hp).sort((a, b) => b.u.c.cost - a.u.c.cost);
  if (kill.length) return kill[0];
  if (us.length) return us.sort((a, b) => b.u.atk - a.u.atk || a.u.hp - b.u.hp)[0];
  return ts[0];
}
function aiAction(p) {
  const P = G.p[p], e = 1 - p;
  // 1) ბარათები — ძვირიდან იაფისკენ
  const order = P.hand.map((id, i) => [cardOf(id), i]).sort((a, b) => b[0].cost - a[0].cost);
  for (const [c, i] of order) {
    if (!playable(p, c)) continue;
    if (c.type === "unit") {
      const cells = legalCells(p, c);
      const lanes = [0, 1, 2].sort((a, b) => laneScore(p, b) - laneScore(p, a) + (Math.random() - .5) * .6);
      let pick = null;
      if (has(c, "scout")) pick = cells.find(([l, ps]) => ps === "nml" && !at(l, e, "nml").length);
      for (const l of lanes) { if (pick) break; pick = cells.find(([ll, ps]) => ll === l && ps === "trench") || cells.find(([ll, ps]) => ll === l && ps === "rear"); }
      if (pick) return () => play(p, i, pick);
    } else if (c.type === "structure") {
      const cells = legalCells(p, c).sort((a, b) => at(b[0], p, "trench").length - at(a[0], p, "trench").length || laneScore(p, b[0]) - laneScore(p, a[0]));
      if (cells.length) return () => play(p, i, cells[0]);
    } else if (c.id === "barrage") {
      const l = [0, 1, 2].sort((a, b) => at(b, e, "trench").length - at(a, e, "trench").length)[0];
      if (at(l, e, "trench").length >= 1) return () => play(p, i, l);
    } else if (c.id === "gas") {
      const sc = l => alive().filter(x => x.lane === l && !has(x, "gas_mask")).reduce((a, x) => a + (x.o === e ? 1 : -1.2), 0);
      const l = [0, 1, 2].sort((a, b) => sc(b) - sc(a))[0];
      if (sc(l) >= 1) return () => play(p, i, l);
    } else if (c.id === "volley") {
      const sc = l => G.units.filter(u => u.o === p && u.lane === l && canAttack(u) && targets(u).length).length;
      const l = [0, 1, 2].sort((a, b) => sc(b) - sc(a))[0];
      if (sc(l) >= 2) return () => play(p, i, l);
    } else if (c.id === "raid") {
      const us = legalOwn(p, c).filter(u => !u.acted).sort((a, b) => b.atk - a.atk);
      if (us.length && us[0].atk >= 3) return () => play(p, i, us[0]);
    } else if (c.id === "hospital") {
      const us = legalOwn(p, c).filter(u => u.max - u.hp >= 3).sort((a, b) => (b.max - b.hp) - (a.max - a.hp));
      if (us.length) return () => play(p, i, us[0]);
    } else if (c.id === "camo") {
      const us = legalOwn(p, c).filter(u => u.pos === "nml" && u.hp <= 3);
      if (us.length) return () => play(p, i, us[0]);
    } else if (c.id === "train") {
      if (P.hand.some(id => { const x = cardOf(id); return x.id !== "train" && x.cost > P.avail && x.cost <= P.avail + 2; })) return () => play(p, i);
    } else if (c.id === "recon") {
      if (P.hand.length <= 5) return () => play(p, i);
    } else if (c.id === "porter") return () => play(p, i);
  }
  // 2) შეტევა
  const mine = G.units.filter(u => u.o === p && u.hp > 0).sort((a, b) => absPos(b) * (p ? -1 : 1) - absPos(a) * (p ? -1 : 1));
  for (const u of mine) if (canAttack(u)) { const ts = targets(u); if (ts.length) return () => attack(u, pickTarget(u, ts)); }
  // 3) წინსვლა — ვისაც სამიზნე არ აქვს
  for (const u of mine) {
    if (u.moved || u.acted) continue;
    if (canAttack(u) && targets(u).length) continue;
    if (u.pos === "rear" && has(u, "long") && targets(u).length) continue;
    const mv = moves(u);
    const fwd = u.pos === "rear" ? "trench" : u.pos === "trench" ? "nml" : null;
    if (fwd && mv.includes(fwd)) {
      if (fwd === "nml" && u.hp <= 2 && at(u.lane, e, "nml").reduce((a, x) => a + x.atk, 0) >= u.hp + 2) continue;
      return () => move(u, fwd);
    }
  }
  return null;
}

// ---------- ძლიერი კომპიუტერი: ყველა დასაშვებ სვლას ასლზე ცდის და საუკეთესოს ირჩევს (ერთი ნაბიჯი წინ, ხარბად) ----------
const DEFW = { hq: 1.6, hqLow: 0.35, atk: 1.0, hp: 0.75, cost: 0.35, fwd: 0.35, nml: 2.2, brk: 40, lose: 400, threat: 0.9, press: 0.5, risk: 0.45, card: 1.1, porter: 2.2, bank: 0.5, fort: 1.6, kw: 0.6 };
function cloneG(g) {

}
function legalActions(p) {
  const acts = [], P = G.p[p];
  P.hand.forEach((id, i) => {
    const c = cardOf(id);
    if (!playable(p, c)) return;
    const n = needs(c);
    if (n === "cell") legalCells(p, c).forEach(tg => acts.push({ t: "play", i, tg }));
    else if (n === "lane") [0, 1, 2].forEach(l => acts.push({ t: "play", i, tg: l }));
    else if (n === "own") legalOwn(p, c).forEach(u => acts.push({ t: "play", i, uid: u.id }));

}
function doAction(a) {
  const U = id => G.units.find(u => u.id === id);
  if (a.t === "play") return play(G.cur, a.i, a.uid != null ? U(a.uid) : a.tg);
  if (a.t === "atk") return attack(U(a.uid), a.k === "hq" ? { k: "hq" } : a.k === "u" ? { k: "u", u: U(a.tid) } : { k: "f", f: G.forts[a.tid] });

}
// რამდენი ზიანი შეიძლება მიიღოს იუნიტმა მტრის მომდევნო სვლაზე (უხეში შეფასება: იმავე ხაზის მტრები, რომლებსაც მასთან მიწვდომა აქვთ)
function incoming(u) {
  let d = 0;
  for (const x of G.units) {
    if (x.o === u.o || x.hp <= 0) continue;
    if (has(x, "fly")) { d += x.atk * 0.5; continue; }
    if (x.lane !== u.lane) continue;
    if (x.pos === "rear" && !has(x, "long")) { if (u.pos === "nml") d += x.atk * 0.3; continue; }
    d += x.atk;

function unitVal(u, W) {

function evaluate(p) {

  const W = G.p[p].W || DEFW;
  const e = 1 - p, P = G.p[p], E = G.p[e];
  let s = (P.hq - E.hq) * W.hq + (Math.max(0, 10 - E.hq) - Math.max(0, 10 - P.hq)) * W.hqLow * 2;
  for (const u of G.units) {
    if (u.hp <= 0) continue;
    const v = unitVal(u, W);

  if (mine === 3) s += W.brk;
  for (const l of [0, 1, 2]) {

    if (!own.length) { const hit = foe.filter(u => u.pos === "nml").reduce((a, u) => a + u.atk, 0); s -= hit * W.threat; if (hit >= P.hq) s -= W.lose; }

    <p>${t("ორი დასტა, სამი ხაზი. მოიგებს ის, ვინც მტრის შტაბის ნებისყოფას 20-დან 0-მდე ჩამოიყვანს ან სვლის დასაწყისში სამივე ნეიტრალურ ზოლს დაიჭერს.",
      "Two decks, three lines. You win by bringing the enemy HQ's nerve from 20 to 0, or by holding No Man's Land on all three lines at the start of your turn.")}</p>
    <div class="row"><label>${t("შენი დასტა", "Your deck")}<select id="sMe">${deckOptions(PREF.me)}</select></label>
      <label>${t("მოწინააღმდეგე", "Opponent")}<select id="sFoe">${deckOptions(PREF.foe, true)}</select></label></div>
    <p class="deck" id="sDeck"></p>
    <div class="row"><label>${t("რეჟიმი", "Mode")}<select id="sMode"><option value="ai" ${PREF.mode === "ai" ? "selected" : ""}>${t("კომპიუტერის წინააღმდეგ", "Against the computer")}</option>
      <option value="hot" ${PREF.mode === "hot" ? "selected" : ""}>${t("ორი მოთამაშე ერთ ეკრანზე", "Two players, one screen")}</option></select></label>
      <label>${t("კომპიუტერი", "Computer")}<select id="sLevel"><option value="hard">${t("ძლიერი", "Strong")}</option><option value="easy" ${PREF.level === "easy" ? "selected" : ""}>${t("მარტივი", "Easy")}</option></select></label>
      <label>${t("ვინ იწყებს", "Who goes first")}<select id="sFirst"><option value="random">${t("შემთხვევით", "Random")}</option><option value="0" ${PREF.first === "0" ? "selected" : ""}>${t("შენ", "You")}</option><option value="1" ${PREF.first === "1" ? "selected" : ""}>${t("მოწინააღმდეგე", "Opponent")}</option></select></label></div>
    <p class="deck">${t("ფრჩხილებში — დასტის მოგების წილი სიმულაციაში ყველა სხვა დასტის წინააღმდეგ.", "In brackets: the deck's simulated win rate against every other deck.")}</p>
    <div class="acts">${G ? `<button class="btn" type="button" id="sCancel">${t("დაბრუნება", "Back")}</button>` : ""}<button class="btn primary" type="button" id="sGo">${t("დაწყება", "Start")}</button></div>`);
  const upd = () => { $("sDeck").innerHTML = `<b>${esc(fname($("sMe").value))}:</b> ${deckList($("sMe").value)}`; };
  $("sMe").onchange = upd; upd();
  const lv = () => { $("sLevel").disabled = $("sMode").value !== "ai"; };
  $("sMode").onchange = lv; lv();
  if ($("sCancel")) $("sCancel").onclick = hideDlg;
  $("sGo").onclick = () => {
    PREF = { me: $("sMe").value, foe: $("sFoe").value, mode: $("sMode").value, first: $("sFirst").value, level: $("sLevel").value };
    try { localStorage.setItem("cg-pref", JSON.stringify(PREF)); } catch (e) {}
    let foe = PREF.foe;
    if (foe === "random") { const fs = Object.keys(D.starter).filter(f => f !== PREF.me); foe = fs[rnd(fs.length)]; }
    hideDlg();
    newGame({ me: PREF.me, foe, mode: PREF.mode, first: PREF.first === "random" ? rnd(2) : +PREF.first, level: PREF.level });
  };
}
function rulesScreen() {
  showDlg("rules", `<h2>${t("წესები მოკლედ", "Rules in brief")}</h2><div class="rules">${t(`

      <li><b>ჩამოიყვანე</b> იუნიტი შენს ზურგში ან სანგარში (ადგილზე მაქს. 2; მზვერავი — ნეიტრალურ ზოლშიც). ნაგებობა — სანგარში, ხაზზე 1.</li>
      <li><b>გადაადგილება:</b> იუნიტი 1 ნაბიჯით წინ ან უკან. ახლა ჩამოსული ადგილზე რჩება; ვინც გადაადგილდა ან ახლა ჩამოვიდა, ვერ უტევს (გარდა იერიშისა).</li>
      <li><b>შეტევა:</b> თავისი ხაზის უახლოეს მტერს (ნეიტრალური ზოლი → სანგარი → ზურგი). ზურგიდან მხოლოდ „შორი“ ურტყამს. თუ ხაზზე მტერი არ არის, ნეიტრალურ ზოლში მდგომი შტაბს ურტყამს.</li>
      <li>სვლის ბოლოს მოქმედებს ნაგებობები და მკურნალები.</li></ul>
    <h3>ზიანი</h3><ul><li>ზიანი = შეტევა. ხელჩართულში (მეზობელ ადგილზე, არა „შორი“) სამიზნე პასუხს სცემს.</li><li>თხრილი სანგარში მდგომს −1-ით იცავს; მესერი სანგარს ხელჩართულისგან ფარავს, სანამ არ დაინგრევა.</li></ul>
    <h3>მართვა</h3><ul><li>ბარათი ხელიდან → ოქროსფერი ადგილი ველზე. შენი იუნიტი → ოქროსფერი ადგილი (გადაადგილება) ან წითლად მონიშნული მტერი (შეტევა).</li><li>Esc ან „გაუქმება“ — არჩევანის მოხსნა.</li></ul>`,
    `<h3>Setup</h3><ul><li>Both players draw 5 cards. Whoever goes second draws 1 extra card and gets +2 supply on their first turn.</li></ul>
    <h3>Goal</h3><ul><li>Bring the enemy HQ's nerve from 20 to 0, or</li><li><b>Breakthrough:</b> hold No Man's Land on all three lines at the start of your turn.</li></ul>
    <h3>Your turn</h3><ul><li>Draw 1 card (if your deck is empty, your HQ loses 2).</li><li><b>Supply:</b> 3 + porters (max. 3) + lines where you hold No Man's Land + carried over (max. 3).</li>

  $("rOk").onclick = () => { hideDlg(); if (!G) setupScreen(); };
}
function endScreen() {
  if (!G || !G.over) return;
  const v = viewer(), w = G.over.p, mine = G.mode === "ai" ? w === 0 : true;
  const title = G.mode === "ai" ? (mine ? t("გამარჯვება", "Victory") : t("დამარცხება", "Defeat")) : t(`${fname(G.p[w].fid)} იმარჯვებს`, `${fname(G.p[w].fid)} wins`);
  showDlg("end", `<h2>${title}</h2><p>${G.over.how === "break" ? t("გარღვევა: სამივე ნეიტრალური ზოლი დაკავებულია.", "Breakthrough: all three No Man's Lands are held.") : t("მოწინააღმდეგის შტაბი დაეცა.", "The enemy HQ has fallen.")}</p>
    <p class="deck">${t(`სვლები: ${G.turn} · დაცემული: ${fname(G.p[0].fid)} ${G.p[0].fallen}, ${fname(G.p[1].fid)} ${G.p[1].fallen}`, `Turns: ${G.turn} · fallen: ${fname(G.p[0].fid)} ${G.p[0].fallen}, ${fname(G.p[1].fid)} ${G.p[1].fallen}`)}</p>
    <div class="acts"><button class="btn" type="button" id="eLook">${t("ველის ნახვა", "View board")}</button><button class="btn primary" type="button" id="eNew">${t("ახალი თამაში", "New game")}</button></div>`);
  $("eLook").onclick = hideDlg; $("eNew").onclick = setupScreen;
}
function passScreen() {
  showDlg("pass", `<h2>${t(`${fname(G.p[G.cur].fid)}-ის სვლა`, `${fname(G.p[G.cur].fid)} to play`)}</h2><p>${t("გადაეცი მოწყობილობა მეორე მოთამაშეს. ხელი დამალულია, სანამ ის მზად არ იქნება.", "Pass the device to the other player. The hand stays hidden until they are ready.")}</p>
    <div class="acts"><button class="btn primary" type="button" id="pGo">${t("მზად ვარ", "Ready")}</button></div>`);
  $("pGo").onclick = () => { hideDlg(); render(); };
}

render();
setupScreen();
