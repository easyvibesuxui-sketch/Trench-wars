<title>სამი ხაზი</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700&family=Noto+Serif+Georgian:wght@700;800&display=swap">
<style>
/* „სამი ხაზი“ — ერთ ეკრანზე დალაგებული საბრძოლო მაგიდა. ზემოთ მტრის შტაბი, შუაში ველი (სანგრის რუკა: 5 ზონა × 3 ხაზი, ზონის
   სახელი — მწკრივის თავში), ქვემოთ შენი შტაბი და ხელი; ფართო ეკრანზე მარჯვნივ ბარათის აღწერა და ჟურნალი. მხოლოდ მუქი თემა. */
:root {
  --mud: #221d17; --mud-2: #2f281f; --mud-3: #3b3227; --paper: #e9dfc8; --ink: #f1e8d6; --muted: #b3a58b;
  --bronze: #c8913e; --rust: #c0563d; --moss: #8a9a5b; --line: #54473a;
  --rear: #2a231b; --trench: #34291e; --nml: #4a3d2b; --me: #c8913e; --foe: #b4462f;
  --atk: #7a1f1a; --hp: #2f5d50; --hurt: #8a5a1a;
  --display: "Noto Serif Georgian", "DejaVu Serif", Georgia, serif;
  --body: "Noto Sans Georgian", "DejaVu Sans", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--mud); }
body { color: var(--ink); font-family: var(--body); font-size: 14px; }
button { font: inherit; color: inherit; }
.app { height: 100%; min-height: 540px; max-width: 1400px; margin: 0 auto; display: grid; gap: 6px;
  padding-block: 6px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  grid-template-columns: minmax(0, 1fr) 290px; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "top top" "table side" "hand side"; }
header { grid-area: top; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; justify-content: space-between; }
h1 { font-family: var(--display); font-size: 1.1rem; margin: 0; text-wrap: balance; }
h1 small { font-family: var(--body); font-weight: 400; color: var(--muted); font-size: .76rem; margin-left: 6px; }
.tools { display: flex; gap: 6px; align-items: center; }
.btn { background: var(--mud-2); border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--bronze); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { border-color: var(--bronze); color: var(--bronze); font-weight: 700; }
#bLog { display: none; }
:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.lang button { border: 0; background: transparent; padding: 5px 9px; cursor: pointer; font-size: .78rem; }
.lang button[aria-pressed="true"] { background: var(--mud-3); font-weight: 700; color: var(--bronze); }

/* მაგიდა */
.table { grid-area: table; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 4px; }
.hq { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: center; padding: 4px 10px; border-radius: 5px; background: var(--mud-2); border: 1px solid var(--line); font-size: .8rem; }
.hq.foe { border-left: 4px solid var(--foe); } .hq.me { border-left: 4px solid var(--me); }
.hq b.name { font-family: var(--display); font-size: .92rem; }
.hq .stat { font-variant-numeric: tabular-nums; color: var(--muted); }
.hq .stat strong { color: var(--ink); }
.hq .nerve { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.hq .nerve strong { font-size: 1rem; }
.hq .bar { width: 80px; height: 7px; background: #15110d; border-radius: 4px; overflow: hidden; }
.hq .bar i { display: block; height: 100%; background: var(--moss); }
.hq .turn { color: var(--bronze); font-weight: 700; }
.hq.target { outline: 2px dashed var(--rust); cursor: pointer; }
.field { min-height: 0; display: grid; grid-template-columns: 88px repeat(3, minmax(0, 1fr)); grid-template-rows: auto .85fr 1fr 1.9fr 1fr .85fr;
  border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--rear); }
.lh { font-size: .66rem; color: var(--muted); text-align: center; padding: 2px; background: var(--mud-2); border-bottom: 1px solid var(--line); letter-spacing: .03em; }
.rh { display: flex; align-items: center; padding: 0 6px; font-size: .66rem; line-height: 1.2; color: var(--muted); background: rgba(0,0,0,.18); border-right: 1px solid var(--line); letter-spacing: .02em; }
.rh.foe { box-shadow: inset 3px 0 0 var(--foe); } .rh.me { box-shadow: inset 3px 0 0 var(--me); }
.cell { position: relative; min-height: 0; min-width: 0; padding: 4px; display: flex; gap: 4px; align-items: center; justify-content: center; border-left: 1px dashed rgba(255,255,255,.07); }
.cell.rear { background: var(--rear); }
.cell.trench { background: var(--trench); background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0 2px, transparent 2px 22px); box-shadow: inset 0 2px 0 rgba(0,0,0,.35), inset 0 -2px 0 rgba(0,0,0,.35); }
.cell.nml { background: var(--nml); background-image: radial-gradient(ellipse 34px 16px at 22% 38%, rgba(0,0,0,.2), transparent 70%), radial-gradient(ellipse 46px 20px at 76% 72%, rgba(0,0,0,.18), transparent 70%), radial-gradient(ellipse 22px 10px at 58% 16%, rgba(0,0,0,.14), transparent 70%);
  flex-direction: column; justify-content: space-between; }
.cell.nml .half { flex: 1 1 0; min-height: 0; width: 100%; display: flex; gap: 4px; align-items: center; justify-content: center; }
.cell.nml.held-me { box-shadow: inset 0 -3px 0 var(--me); } .cell.nml.held-foe { box-shadow: inset 0 3px 0 var(--foe); }
.cell.hl { background-color: #5a4524; cursor: pointer; box-shadow: inset 0 0 0 2px var(--bronze); }
.cell.hl:empty::after, .cell.hl.hasfort:not(:has(.tok))::after, .cell.hl .half:empty::after { content: "+"; color: var(--bronze); font-weight: 700; font-size: 1.2rem; }
.cell.hasfort { padding-bottom: 19px; }
.fort { position: absolute; left: 4px; bottom: 2px; font-size: .62rem; padding: 1px 6px; border-radius: 3px; background: rgba(21,17,13,.88); border: 1px solid var(--line); max-width: calc(100% - 8px);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; z-index: 1; }
.fort.mine { border-color: #7a6234; } .fort.foe { border-color: #7a3a2c; }
.fort.target { outline: 2px solid var(--rust); }

/* იუნიტი ველზე: ზომა უჯრის სიმაღლეს მიჰყვება */
.tok { position: relative; height: 100%; max-height: 132px; aspect-ratio: 3 / 4; flex: 0 0 auto; border-radius: 5px; border: 2px solid var(--me); padding: 0; cursor: pointer;
  background-color: var(--mud-3); background-repeat: no-repeat; overflow: hidden; }
.tok.foe { border-color: var(--foe); }
.tok .a, .tok .h { position: absolute; bottom: 2px; min-width: 16px; padding: 0 3px; border-radius: 3px; font-weight: 700; font-size: .7rem; line-height: 1.35; font-variant-numeric: tabular-nums; text-align: center; }
.tok .a { left: 2px; background: var(--atk); } .tok .h { right: 2px; background: var(--hp); }
.tok .h.hurt { background: var(--hurt); }
.tok .st { position: absolute; top: 2px; left: 2px; right: 2px; display: flex; gap: 2px; flex-wrap: wrap; }
.tok .st i { font-style: normal; font-size: .56rem; padding: 0 3px; border-radius: 3px; background: rgba(20,16,12,.85); line-height: 1.4; }
.tok.ready { box-shadow: 0 0 0 2px var(--mud), 0 0 0 4px #e7c46b; }
.tok.spent { filter: saturate(.35) brightness(.72); }
.tok.sel { box-shadow: 0 0 0 2px var(--mud), 0 0 0 4px #fff; }
.tok.target { box-shadow: 0 0 0 2px var(--mud), 0 0 0 4px var(--rust); }
.tok.pick { box-shadow: 0 0 0 2px var(--mud), 0 0 0 4px var(--moss); }
.tok.camo { opacity: .6; }
.tok.hit { animation: hit .45s ease-out; }
@keyframes hit { 0% { transform: translateX(0); filter: brightness(2); } 30% { transform: translateX(-3px); } 60% { transform: translateX(3px); } 100% { transform: none; } }
.float { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; color: #ffd9c9; text-shadow: 0 1px 3px #000; pointer-events: none; animation: rise .9s ease-out forwards; }
@keyframes rise { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-18px); } }

/* ხელი */
.handwrap { grid-area: hand; display: grid; gap: 4px; min-width: 0; }
.bar2 { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between; }
.supply { display: inline-flex; gap: 3px; align-items: center; margin-right: 8px; }
.supply i { width: 12px; height: 12px; border-radius: 50%; background: var(--bronze); display: inline-block; }
.hint { color: var(--muted); font-size: .8rem; min-height: 1.2em; flex: 1 1 260px; }
.mini { display: none; }
.hand { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 6px; min-height: 120px; }
.card { flex: none; width: 108px; border-radius: 6px; border: 2px solid var(--line); background: var(--paper); color: #1d1a16; padding: 0; cursor: pointer; text-align: left;
  display: flex; flex-direction: column; overflow: hidden; }
.card .art { height: 70px; background-color: #b9ad9c; background-repeat: no-repeat; position: relative; }
.card .cost { position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--bronze); color: #1d1a16; display: grid; place-items: center; font-weight: 800; font-size: .8rem; }
.card .nm { font-family: var(--display); font-weight: 700; font-size: .72rem; line-height: 1.15; padding: 3px 5px 0; }
.card .sub { font-size: .6rem; color: #6a6158; padding: 1px 5px; }
.card .kw { font-size: .6rem; padding: 0 5px; color: #3d362e; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .ft { margin-top: auto; display: flex; justify-content: space-between; padding: 2px 5px 4px; font-weight: 800; font-size: .8rem; }
.card .ft .a { color: var(--atk); } .card .ft .h { color: var(--hp); }
.card.can { border-color: var(--bronze); }
.card.no { opacity: .55; }
.card.sel { border-color: #fff; transform: translateY(-4px); }

/* გვერდითი პანელი */
.side { grid-area: side; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 6px; }
.panel { border: 1px solid var(--line); border-radius: 6px; background: var(--mud-2); padding: 10px; min-height: 0; }
.panel h2 { font-family: var(--display); font-size: .98rem; margin: 0 0 6px; }
.logp { display: flex; flex-direction: column; }
.detail .big { width: 100%; max-width: 100%; aspect-ratio: 2 / 3; max-height: 30vh; border-radius: 5px; background-color: var(--mud-3); background-repeat: no-repeat; margin: 0 auto 8px; }
.detail p { margin: 4px 0; font-size: .84rem; }
.detail .meta { color: var(--muted); font-size: .76rem; }
.detail ul { margin: 4px 0 0; padding-left: 18px; font-size: .8rem; }
.detail .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.log { flex: 1; min-height: 0; overflow-y: auto; font-size: .76rem; display: grid; gap: 3px; align-content: start; }
.log div { color: var(--muted); } .log div.me { color: #e6cf9f; } .log div.foe { color: #e2a594; } .log div.sys { color: var(--ink); font-weight: 600; }

/* ვიწრო ეკრანი: პანელი იმალება, აღწერა — მოკლე ზოლად ხელის თავზე, ჟურნალი — ღილაკით */
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "table" "hand"; min-height: 600px; }
  .side { display: none; }
  #bLog { display: inline-block; }
  h1 small { display: none; }
  .mini { display: flex; gap: 8px; align-items: center; font-size: .76rem; min-height: 28px; padding: 3px 8px; background: var(--mud-2); border: 1px solid var(--line); border-radius: 5px; }
  .mini:empty { display: none; }
  .mini span { flex: 1; min-width: 0; color: var(--muted); }
  .mini b { color: var(--ink); }
  .mini .btn { padding: 2px 8px; font-size: .74rem; }
}
@media (max-width: 600px) {
  h1 { font-size: .98rem; }
  .tools { flex-wrap: wrap; gap: 4px; }
  .btn, .lang button { font-size: .74rem; padding: 4px 7px; }
  .field { grid-template-columns: 5px repeat(3, minmax(0, 1fr)); }
  .rh { font-size: 0; padding: 0; border-right: 0; }
  .cell[data-z]::before { content: attr(data-z); position: absolute; left: 3px; top: 1px; font-size: .52rem; color: var(--muted); opacity: .8; pointer-events: none; }
  .cell { padding: 3px; gap: 3px; }
  .hand { min-height: 112px; }
  .card { width: 96px; } .card .art { height: 58px; }
  .hq { font-size: .72rem; gap: 2px 8px; } .hq .bar { width: 50px; }
  .hq .opt { display: none; }
}
@media (max-height: 740px) and (min-width: 901px) { .card .art { height: 56px; } .card .kw { -webkit-line-clamp: 2; } }
.overlay { position: fixed; inset: 0; background: rgba(18, 14, 10, .86); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 10; overflow-y: auto; }
.overlay[hidden] { display: none; }
.overlay[data-kind="pass"] { background: var(--mud); }
.dialog { width: min(640px, 100%); background: var(--mud-2); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: grid; gap: 12px; }
.dialog h2 { font-family: var(--display); margin: 0; font-size: 1.4rem; color: var(--bronze); }
.dialog p { margin: 0; line-height: 1.5; }
.dialog label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
.dialog select { font: inherit; background: var(--mud); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 7px; }
.dialog .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
@media (max-width: 560px) { .dialog .row { grid-template-columns: 1fr; } }
.dialog .deck { font-size: .78rem; color: var(--muted); line-height: 1.45; }
.dialog .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.dialog.wide { width: min(1100px, 100%); }
.dialog .acts.left { justify-content: flex-start; }
.dialog input { font: inherit; background: var(--mud); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 7px; min-width: 0; }
.bhead { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; } .bhead h2 { flex: 1 1 100%; }
.bhead label { flex: 1 1 200px; }
.bstat { font-size: .84rem; color: var(--muted); } .bstat .ok { color: var(--moss); } .bstat .bad { color: #e2a594; }
.bcols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 700px) { .bcols { grid-template-columns: minmax(0, 1fr); } }
.bcol { display: grid; gap: 6px; align-content: start; min-width: 0; } .bcol h3 { margin: 4px 0 0; font-size: .9rem; color: var(--bronze); }
.btabs { display: flex; flex-wrap: wrap; gap: 4px; }
.blist { max-height: 46vh; overflow-y: auto; display: grid; gap: 4px; padding-right: 2px; }
.brow { display: grid; grid-template-columns: 30px 22px minmax(0, 1fr) auto auto auto; gap: 6px; align-items: center; padding: 3px 4px; border: 1px solid var(--line); border-radius: 5px; background: var(--mud); }
.bart { width: 30px; aspect-ratio: 3 / 4; border-radius: 3px; background-color: var(--mud-3); background-repeat: no-repeat; }
.bcost { width: 22px; height: 22px; border-radius: 50%; background: var(--bronze); color: #1d1a16; display: grid; place-items: center; font-weight: 800; font-size: .76rem; }
.binfo { display: grid; min-width: 0; } .binfo b { font-size: .8rem; } .binfo small { font-size: .68rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bn { min-width: 1.4em; text-align: center; font-variant-numeric: tabular-nums; color: var(--bronze); font-weight: 700; }
.brow .btn { padding: 2px 9px; }
.camp { margin: 0; padding-left: 20px; display: grid; gap: 3px; font-size: .88rem; color: var(--muted); }
.camp li.done { color: var(--moss); } .camp li.now { color: var(--bronze); font-weight: 700; }
.dialog .ok { color: var(--moss); } .dialog .bad { color: #e2a594; }
.dialog h3 { margin: 4px 0 0; font-size: .95rem; color: var(--bronze); }
.rewards { display: flex; flex-wrap: wrap; gap: 8px; }
.rules { font-size: .88rem; line-height: 1.5; } .rules h3 { margin: 10px 0 2px; font-size: .95rem; color: var(--bronze); } .rules ul { margin: 0; padding-left: 18px; }
@media (prefers-reduced-motion: reduce) { .tok.hit, .float { animation: none; } }
</style>

<script>
"use strict";
const D = window.CG;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let LANG = "ka";
try { LANG = localStorage.getItem("cg-lang") || "ka"; } catch (e) {}
const t = (ka, en) => LANG === "en" ? en : ka;
const nm = c => LANG === "en" ? c.en : c.ka;
const KWN = k => D.kw[k] ? (LANG === "en" ? D.kw[k].en : D.kw[k].ka) : k;
const KWR = k => D.kw[k] ? (LANG === "en" ? D.kw[k].ren : D.kw[k].rka) : "";
const BIG = new Set(["IV", "IV+", "V"]);
const KIND = { "ნაგებობა": "structure", "ბრძანება": "order", "მარაგი": "supply" };
const KINDN = { structure: ["ნაგებობა", "Structure"], order: ["ბრძანება", "Order"], supply: ["მარაგი", "Supply"], unit: ["იუნიტი", "Unit"] };
const POSN = { rear: ["ზურგი", "rear"], trench: ["სანგარი", "trench"], nml: ["ნეიტრალური ზოლი", "No Man's Land"] };
const LANEN = [["მარცხენა ფლანგი", "Left flank"], ["ცენტრი", "Centre"], ["მარჯვენა ფლანგი", "Right flank"]];
const sprite = a => a ? `background-image:url(${a.s});background-size:${a.c * 100}% ${a.r * 100}%;background-position:${a.c > 1 ? a.x / (a.c - 1) * 100 : 0}% ${a.r > 1 ? a.y / (a.r - 1) * 100 : 0}%` : "";
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function cardOf(id) {
  if (D.units[id]) return { id, type: "unit", ...D.units[id] };
  const c = D.common[id];
  return { id, type: KIND[c.kind] || "order", ...c };
}
const cname = c => nm(c);
const ctext = c => c.type === "unit" ? "" : (LANG === "en" ? c.ten : c.tka);
const fname = f => nm(D.factions[f]);

// ---------- ხმა: WebAudio-თი სინთეზირებული (ფაილების გარეშე); ჩაირთვება პირველი დაჭერის შემდეგ ----------
let SOUND = true, AC = null;
try { SOUND = localStorage.getItem("cg-sound") !== "off"; } catch (e) {}
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

    case "build": noise(.12, .2, "bandpass", 500); noise(.12, .18, "bandpass", 420, .14); break;

// ანიმაცია: შემტევი სამიზნისკენ იწევს; ახლად ჩამოსული ჩნდება
let FXA = [], FXN = [];

// ---------- თამაში ----------
let G = null, SEL = null, BUSY = false, UID = 0, SIM = false, HEADLESS = false;   // HEADLESS — ტესტები და ტიუნერი: ხატვის, ხმის და ანიმაციის გარეშე   // SIM — კომპიუტერი სვლას ასლზე ცდის: ჟურნალი, ეფექტები და ეკრანები გამორთულია

function newGame(opt) {
  // დასტა: ფრაქციის id (სასტარტო დასტა) ან {f, units, common, name} (შენი დასტა, კამპანია)
  const mk = (spec, ai) => {
    const deck = [];
    const s = typeof spec === "string" ? D.starter[spec] : spec, fid = typeof spec === "string" ? spec : spec.f;
    for (const [id, n] of Object.entries(s.units)) for (let i = 0; i < n; i++) deck.push(id);
    for (const [id, n] of Object.entries(s.common)) for (let i = 0; i < n; i++) deck.push(id);

  if (opt.foeHq) G.p[1].hq = opt.foeHq;
  for (const P of G.p) for (let i = 0; i < 5; i++) P.hand.push(P.deck.pop());

  G.p[1 - opt.first].bank = 2;   // მეორე მოთამაშის კომპენსაცია: +1 ბარათი და პირველ სვლაზე +2 მარაგი

}

const viewer = () => G.mode === "hot" ? G.cur : 0;
const alive = () => G.units.filter(u => u.hp > 0);
const at = (lane, o, pos) => G.units.filter(u => u.hp > 0 && u.lane === lane && u.o === o && u.pos === pos);
const fort = (lane, o) => G.forts[lane + ":" + o];
const has = (u, k) => u.kw.includes(k);
const absPos = u => u.o === 0 ? { rear: 0, trench: 1, nml: 2 }[u.pos] : { rear: 4, trench: 3, nml: 2 }[u.pos];
const fortAbs = f => f.o === 0 ? 1 : 3;
const nmlCtrl = o => [0, 1, 2].filter(l => at(l, o, "nml").length && !at(l, 1 - o, "nml").length).length;
const isSup = u => u.supTurn === G.turn;
const leaderBonus = u => G.units.some(x => x !== u && x.hp > 0 && x.o === u.o && x.lane === u.lane && has(x, "leader")) ? 1 : 0;

function log(msg, cls) { if (SIM) return; G.log.push([msg, cls || (G.cur === viewer() ? "me" : "foe")]); if (G.log.length > 80) G.log.shift(); }

function startTurn() {

  for (const u of G.units.filter(u => u.o === p && u.hp > 0)) {
    if (u.burn) { u.hp -= 1; u.burn = false; log(() => t(`${cname(u.c)} იწვის (−1).`, `${cname(u.c)} burns (−1).`)); }
    if (has(u, "regen") && u.hp > 0 && u.hp < u.max) u.hp = Math.min(u.max, u.hp + 1);

  SEL = null;

function endTurn() {
  const p = G.cur, P = G.p[p];
  for (const f of Object.values(G.forts)) {
    if (f.o !== p || !f.atk) continue;
    const pool = f.id === "nest" ? [...at(f.lane, 1 - p, "nml"), ...at(f.lane, 1 - p, "trench")] : alive().filter(u => u.o !== p && u.lane === f.lane);
    const ts = pool.filter(u => !u.camo);
    if (!ts.length) continue;
    const x = ts.reduce((a, b) => b.hp < a.hp ? b : a);
    const d = dmg({ kw: f.id === "nest" ? ["suppress"] : [], o: p }, x, f.atk);
    sfx("shot");
    log(() => t(`${cname(cardOf(f.id))} ესვრის: ${cname(x.c)} −${d}.`, `${cname(cardOf(f.id))} fires: ${cname(x.c)} −${d}.`));
  }
  for (const h of G.units.filter(u => u.o === p && u.hp > 0 && has(u, "healer"))) {
    const hurt = G.units.filter(u => u.o === p && u.hp > 0 && u.lane === h.lane && u.hp < u.max);
    if (hurt.length) { const x = hurt.reduce((a, b) => b.hp < a.hp ? b : a); x.hp = Math.min(x.max, x.hp + 2); }

  cleanup();
  P.bank = Math.min(3, Math.max(0, P.avail));
  P.avail = 0;
  if (G.over) return;
  G.cur = 1 - p;
  startTurn();
}

function win(p, how) {
  G.over = { p, how };
  if (SIM) return;
  if (HEADLESS) return;
  sfx(G.mode === "hot" || p === 0 ? "win" : "lose");
  log(() => how === "break" ? t(`გარღვევა! ${fname(G.p[p].fid)} სამივე ნეიტრალურ ზოლს აკონტროლებს.`, `Breakthrough! ${fname(G.p[p].fid)} holds No Man's Land on all three lines.`)
    : t(`${fname(G.p[1 - p].fid)}-ის შტაბი დაეცა.`, `${fname(G.p[1 - p].fid)}: the HQ has fallen.`), "sys");

}

function cleanup() {
  for (const u of G.units) if (u.hp <= 0 && !u.dead) {
    u.dead = true; G.p[u.o].fallen++; sfx("fall");
    log(() => t(`${cname(u.c)} დაეცა.`, `${cname(u.c)} has fallen.`), u.o === viewer() ? "foe" : "me");
    if (has(u, "hero")) {   // გმირის დაცემა შტაბის ნებისყოფას −2-ით ამცირებს
      G.p[u.o].hq -= 2; if (!SIM) FXHQ.push([u.o, 2]);

}

// ზიანი: შეტევა + მონადირე/საზენიტო; ფარი −1; თხრილი −1 (თუ მტვრევა არ არის); მინ. 1

function canAttack(u) {

// სამიზნეები: [{k:"u",u}] | [{k:"f",f}] | [{k:"hq"}]
function targets(u) {

  const units = (lane, pos) => at(lane, e, pos).filter(x => !x.camo);

function attack(u, tg) {

  u.acted = true;

function moves(u) {
  if (u.o !== G.cur || u.moved || u.acted || u.fresh) return [];   // ახლა ჩამოსული ამ სვლაზე არ მოძრაობს

  if (pos === "nml") { const w = fort(u.lane, 1 - u.o); if (w && w.id === "wire") { u.noAtk = true; } }
  log(() => t(`${cname(u.c)} ${fwd ? "წინ" : "უკან"}: ${POSN[pos][0]}.`, `${cname(u.c)} moves ${fwd ? "up" : "back"}: ${POSN[pos][1]}.`));
}

// ხელიდან გათამაშება: რა სამიზნე სჭირდება
function needs(c) {

  if (c.type === "structure") return "cell";

}

    for (const l of [0, 1, 2]) for (const pos of has(c, "scout") ? ["rear", "trench", "nml"] : ["rear", "trench"]) if (at(l, p, pos).length < 2) out.push([l, pos]);

function play(p, hi, tg) {

  if (c.type === "unit") {
    const [lane, pos] = tg;
    const u = { id: ++UID, c, o: p, lane, pos, hp: c.hp, max: c.hp, atk: c.atk, kw: c.kw, fresh: true, moved: false, acted: false, supTurn: null, burn: false, camo: false, noAtk: false };
    if (pos === "nml") { const w = fort(lane, 1 - p); if (w && w.id === "wire") u.noAtk = true; }

    log(() => t(`${cname(c)} ჩამოვიდა (${LANEN[lane][0]}, ${POSN[pos][0]}).`, `${cname(c)} deployed (${LANEN[lane][1]}, ${POSN[pos][1]}).`));
  } else if (c.type === "structure") {

      case "recon": for (let i = 0; i < 2; i++) if (P.deck.length) P.hand.push(P.deck.pop()); break;

      case "barrage": for (const x of at(tg, e, "trench")) { x.hp -= 2; if (!SIM) FX.push([x.id, 2]); } break;

document.addEventListener("click", ev => {

  if (act && (act.closest("#detail") || act.closest("#mini"))) {
    if (act.dataset.act === "info") return infoScreen();
    if (act.dataset.act === "cancel") return afterAct();
    if (act.dataset.act === "play" && SEL && SEL.hi !== undefined) { play(G.cur, SEL.hi); return afterAct(); }
  }
  if (ev.target.closest("#bEnd")) { if (humanTurn()) { SEL = null; endTurn(); } return; }
  const hand = ev.target.closest("[data-h]");
  if (hand) { if (!humanTurn()) return; const i = +hand.dataset.h; if (SEL && SEL.hi === i && needs(cardOf(G.p[G.cur].hand[i])) === "none" && playable(G.cur, cardOf(G.p[G.cur].hand[i]))) { play(G.cur, i); return afterAct(); } return selectHand(i); }

      if (SEL.own && SEL.own.includes(u)) { play(G.cur, SEL.hi, u); return afterAct(); }
      if (SEL.cells && u.o === G.cur && SEL.cells.some(([ll, pp]) => ll === u.lane && pp === u.pos) && u !== SEL.u) {
        if (SEL.u) move(SEL.u, u.pos); else play(G.cur, SEL.hi, [u.lane, u.pos]);
        return afterAct();

      if (tg) { attack(SEL.u, tg); return afterAct(); }

    }

  }
  if (ev.target.closest("#hqFoe") && humanTurn() && SEL && SEL.tg) { const tg = SEL.tg.find(x => x.k === "hq"); if (tg) { attack(SEL.u, tg); return afterAct(); } }

function campaignStart(f) {

  CAMP = { f, deck: { f, units: { ...D.starter[f].units }, common: { ...D.starter[f].common } }, battle: 0, lives: 3, enemies, reward: null, done: null, added: [] };

}
function campaignBattle() {

function rewardOptions() {
  const d = CAMP.deck, side = D.factions[d.f].side, out = [], seen = new Set();
  const fits = id => { const t2 = { ...d, units: { ...d.units, [id]: (d.units[id] || 0) + 1 } }; return !deckProblems(t2).some(p => !/30/.test(p)); };
  const pick = (pool, n) => { for (let k = 0; k < 40 && n > 0 && pool.length; k++) { const id = pool[rnd(pool.length)]; if (!seen.has(id) && fits(id)) { seen.add(id); out.push(["u", id]); n--; } } };
  const own = Object.keys(D.units).filter(id => D.units[id].f === d.f && D.units[id].tier !== "hero" && D.units[id].tier !== "V");
  const ally = Object.keys(D.units).filter(id => D.units[id].f !== d.f && D.factions[D.units[id].f].side === side && ["I", "II", "III"].includes(D.units[id].tier));
  const heroes = Object.keys(D.units).filter(id => D.units[id].tier === "hero" && D.units[id].f === d.f);
  if (CAMP.battle >= 2 && Math.random() < .5) pick(heroes, 1);
  pick(own, out.length ? 1 : 2);
  pick(ally, 3 - out.length);
  pick(own, 3 - out.length);
  if (out.length < 3) { const cs = Object.keys(D.common).filter(id => (d.common[id] || 0) < 2); while (out.length < 3 && cs.length) out.push(["c", cs.splice(rnd(cs.length), 1)[0]]); }

}
