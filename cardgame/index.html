<style>
/* „სანგრის რიგი“ — ავტომატური ბრძოლის გარბენი. ერთი სვეტი: ზემოთ მტრის რიგი, ქვემოთ შენი რიგი (ორივეს წინა იუნიტი მარცხნივ დგას),

:root {

* { box-sizing: border-box; }

.overlay[hidden] { display: none; }
.dialog { background: var(--mud-2); border: 1px solid var(--line); border-radius: 10px; padding: 16px; max-width: 640px; width: 100%; max-height: 88vh; overflow: auto; display: grid; gap: 10px; }
.rules { font-size: .88rem; line-height: 1.5; } .rules h3 { margin: 10px 0 2px; font-size: .92rem; color: var(--bronze); } .rules ul { margin: 0; padding-left: 18px; } .rules b { color: var(--gold); }

<script>
"use strict";

  { k: "first", xp: 100, ka: "პირველი გარღვევა", en: "First breakthrough", dka: "მოიგე გარბენი", den: "Win a run" },

  { k: "star3", xp: 80, ka: "სამი ვარსკვლავი", en: "Three stars", dka: "გააკეთე ★★★ იუნიტი", den: "Make a ★★★ unit" },
  { k: "relic6", xp: 80, ka: "საგანძური", en: "Treasury", dka: "ერთ გარბენში 6 რელიქვია", den: "Hold 6 relics in one run" },
  { k: "steel", xp: 200, ka: "უმარცხებელი", en: "Unbeaten", dka: "მოიგე გარბენი ერთი ბრძოლის წაგების გარეშე", den: "Win a run without losing a battle" },
  { k: "codex100", xp: 80, ka: "მწიგნობარი", en: "Archivist", dka: "ნახე 100 ბარათი", den: "See 100 cards" },
  { k: "codex300", xp: 200, ka: "მემატიანე", en: "Chronicler", dka: "ნახე 300 ბარათი", den: "See 300 cards" },
  { k: "daily", xp: 100, ka: "დღის გმირი", en: "Hero of the day", dka: "მოიგე დღის გამოწვევა", den: "Win a daily challenge" }

  const m = store.get("tl-meta", null) || {};
  return Object.assign({ xp: 0, lvl: 1, unlocked: ORDER.slice(0, 4), maxDiff: {}, wonWith: {}, stats: { runs: 0, wins: 0, streak: 0, best: 0 }, seen: {}, ach: {}, miss: null, daily: {}, tut: {}, speed: 1 }, m);
}
let M = loadMeta(), R = store.get("tl-run", null), V = { screen: "home", sel: null, pick: "colchis", diff: 0, b: null, note: "", codex: "colchis", up: null };

function addXp(n) {
  M.xp += n; const ups = [];
  while (M.xp >= xpNeed(M.lvl)) { M.xp -= xpNeed(M.lvl); M.lvl++; const f = ORDER.find(x => !M.unlocked.includes(x)); if (f) { M.unlocked.push(f); ups.push(f); } else ups.push(null); }
  return ups;
}

function track() {                                   // გარბენის მრიცხველების ცვლილება → მისიები, ნანახი ბარათები, მიღწევები
  if (!R) return; const got = [];
  if (prevStats) for (const m of missions()) { const def = MISS[m.j], dv = (R.stats[def.k] || 0) - (prevStats[def.k] || 0);
    if (dv > 0 && !m.done) { m.p = Math.min(def.n, m.p + dv); if (m.p >= def.n) { m.done = true; got.push({ xp: def.xp, name: t(def.ka, def.en) }); } } }
  prevStats = Object.assign({}, R.stats);
  for (const id in R.seen) M.seen[id] = Math.max(M.seen[id] || 0, R.seen[id]);
  for (const x of TL.all(R)) M.seen[x.id] = Math.max(M.seen[x.id] || 0, x.st);
  if (R.enemy) for (const x of R.enemy) if (M.seen[x.id] == null) M.seen[x.id] = 0;
  const seenN = Object.keys(M.seen).length, ach = k => { if (!M.ach[k]) { M.ach[k] = true; const a = ACH.find(x => x.k === k); got.push({ xp: a.xp, name: t(a.ka, a.en) }); } };
  if (TL.all(R).some(x => x.st >= 3)) ach("star3");
  if (R.relics.length >= 6) ach("relic6");
  if (seenN >= 100) ach("codex100"); if (seenN >= 300) ach("codex300");
  if (R.phase === "over" && !R.done) {
    R.done = true; M.stats.runs++;
    if (R.won) { M.stats.wins++; M.stats.streak++; M.stats.best = Math.max(M.stats.best, M.stats.streak); M.wonWith[R.f] = (M.wonWith[R.f] || 0) + 1;
      M.maxDiff[R.f] = Math.max(M.maxDiff[R.f] || 0, Math.min(8, R.diff + 1));
      ach("first"); ach(D.factions[R.f].side === "dark" ? "dark" : "light"); if (Object.keys(M.wonWith).length >= 5) ach("five");
      if (R.diff >= 3) ach("d3"); if (R.diff >= 6) ach("d6"); if (!R.stats.losses) ach("steel"); if (R.daily) ach("daily");
    } else M.stats.streak = 0;
    if (R.daily) { const o = M.daily[R.daily] || {}; M.daily[R.daily] = { won: o.won || R.won, best: Math.max(o.best || 0, R.act * 6 + R.step) }; }

  }
  if (got.length) { let ups = []; for (const g of got) ups = ups.concat(addXp(g.xp)); if (V.up) { V.up.got = V.up.got.concat(got); V.up.ups = V.up.ups.concat(ups); } else toast(got.map(g => "✓ " + g.name + " +" + g.xp + " XP").join(" · ") + ups.filter(Boolean).map(f => " · " + t("ახალი ფრაქცია: ", "New faction: ") + fname(f)).join("")); }

let SOUND = store.get("tl-sound", true), AC = null;
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

function tone(f0, f1, dur, type, vol, delay) { const a = ac(); if (!a) return; const t0 = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain(); o.type = type || "sine";
  o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); src.buffer = buf; f.type = filt; f.frequency.value = freq; g.gain.value = vol; src.connect(f).connect(g).connect(a.destination); src.start(t0); }
function sfx(kind) {
  if (!SOUND || (V.b && V.b.skip)) return;
  switch (kind) {
    case "click": tone(660, 520, .06, "triangle", .07); break;
    case "buy": tone(150, 60, .16, "sine", .3); noise(.07, .1, "lowpass", 900); break;
    case "sell": tone(520, 780, .09, "triangle", .1); break;
    case "roll": noise(.12, .14, "bandpass", 1400); noise(.1, .1, "bandpass", 1000, .08); break;
    case "merge": [523, 659, 784, 1047].forEach((f, i) => tone(f, f, .16, "triangle", .13, i * .07)); break;
    case "melee": noise(.06, .28, "bandpass", 1200); tone(110, 70, .12, "sine", .2); break;
    case "shot": noise(.08, .3, "highpass", 1500); tone(900, 200, .05, "square", .035); break;
    case "blast": noise(.6, .55, "lowpass", 380); tone(80, 30, .5, "sine", .38); break;
    case "burn": noise(.2, .12, "highpass", 2500); break;
    case "heal": tone(520, 780, .18, "sine", .09); break;
    case "fall": tone(300, 90, .3, "triangle", .11); break;
    case "win": [392, 494, 587, 784].forEach((f, i) => tone(f, f, .22, "triangle", .14, i * .12)); break;
    case "lose": [392, 330, 262, 196].forEach((f, i) => tone(f, f * .98, .28, "triangle", .13, i * .15)); break;
    case "level": [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, f, .2, "triangle", .13, i * .09)); break;
  }
}

const KMSG = { charge: ["იერიში!", "Charge!"], open: ["გახსნის ცეცხლი", "Opening fire"], barrage: ["არტილერია", "Artillery"], quake: ["გოლიათი წინ გადის", "The giant steps forward"], gas: ["გაზი", "Gas"], frost: ["ყინვა", "Frost"], fatigue: ["გამოფიტვა", "Exhaustion"], burn: ["ცეცხლი", "Fire"] };
function startBattle() {

  V.b = { out, ev: out.sim.ev, i: 0, A: [], B: [], round: 0, speed: M.speed || 1, done: false, skip: false, msg: "", act, ter }; V.screen = "battle"; V.sel = null;

const bview = x => `data-act="binfo" data-uid="${x.uid}" data-buid="${x.uid}"`;

  $("rowB").innerHTML = b.B.map(x => tile(x, { data: bview(x), stars: true, cls: x.dead ? "dead" : "" })).join("");
  $("bmsg").textContent = b.msg;
  $("bctl").innerHTML = b.done
    ? `<span class="${b.out.win ? "ok" : "bad"}"><b>${b.out.win ? t("გამარჯვება!", "Victory!") : t("მარცხი", "Defeat")}</b>${b.out.win ? "" : ` · −${b.out.nerve} ♥${b.out.saved ? " · " + t("ცოცხალმა წყალმა გადაგარჩინა", "the Water of Life saved you") : ""}`}</span><button class="btn big primary" data-act="bnext">${t("გაგრძელება", "Continue")}</button>`
    : `<span class="muted small">${t("რაუნდი", "Round")} ${b.round}</span><span>${[1, 2, 4].map(s => `<button class="btn sm" data-act="speed" data-s="${s}" style="${b.speed === s ? "border-color:var(--gold);color:var(--gold)" : ""}">${s}×</button>`).join(" ")} <button class="btn sm" data-act="skip">${t("გამოტოვება", "Skip")} ⏭</button></span>`;
}
const bel = uid => document.querySelector(`[data-buid="${uid}"]`);
function floatOn(uid, text, cls) { if (V.b.skip || REDUCED) return; const el = bel(uid); if (!el) return; const f = document.createElement("span"); f.className = "float " + (cls || ""); f.textContent = text; el.appendChild(f);
  f.animate([{ transform: "translate(-50%,0)", opacity: 1 }, { transform: "translate(-50%,-34px)", opacity: 0 }], { duration: 750, easing: "ease-out" }).onfinish = () => f.remove(); }
function lunge(src, dst, far) { if (V.b.skip || REDUCED) return; const a = bel(src), d = bel(dst); if (!a || !d) return; const ra = a.getBoundingClientRect(), rd = d.getBoundingClientRect(), k = far ? .55 : .14;
  a.style.zIndex = 4; a.animate([{ transform: "none" }, { transform: `translate(${(rd.left - ra.left) * k}px,${(rd.top - ra.top) * k}px) scale(1.08)` }, { transform: "none" }], { duration: 300, easing: "ease-in-out" }).onfinish = () => { a.style.zIndex = ""; }; }
function jolt(uid) { if (V.b.skip || REDUCED) return; const el = bel(uid); if (el) el.animate([{ transform: "none", filter: "brightness(2.2)" }, { transform: "translateX(-5px)" }, { transform: "translateX(5px)" }, { transform: "none", filter: "none" }], { duration: 260 }); }
function stepBattle() {
  const b = V.b; if (!b || b.done || V.screen !== "battle") return;
  let wait = 0; const find = uid => b.A.concat(b.B).find(x => x.uid === uid);
  const e = b.ev[b.i++]; if (!e) { b.done = true; drawBattle(); return; }
  if (e.t === "init") { b.A = e.a.map(x => Object.assign({ burn: 0, sup: 0 }, x)); b.B = e.b.map(x => Object.assign({ burn: 0, sup: 0 }, x)); b.msg = L2(TL.TER[e.terrain]); drawBattle(); wait = 500; }
  else if (e.t === "phase") { if (b.ev[b.i] && b.ev[b.i].t === "hit") { b.msg = L2(KMSG[e.k]); drawBattle(); wait = 250; } }
  else if (e.t === "round") { b.round = e.n; b.msg = t("რაუნდი ", "Round ") + e.n; drawBattle(); wait = 160; }
  else if (e.t === "hit") { const g = [e]; while (b.ev[b.i] && b.ev[b.i].t === "hit" && b.ev[b.i].k === e.k) g.push(b.ev[b.i++]);
    const kd = KIND[e.k] || ["shot", 0]; if (KMSG[e.k]) { b.msg = L2(KMSG[e.k]); $("bmsg").textContent = b.msg; }
    for (const h of g) { const v = find(h.d); if (v) { v.hp -= h.n; v.cover = Math.max(0, (v.cover || 0) - h.c); }

      jolt(h.d); floatOn(h.d, h.n ? "−" + h.n : "◈", h.n ? "" : "block"); }

    for (const d of ds) { const v = find(d.d); if (v) v.dead = true; const el = bel(d.d); if (el) el.classList.add("dead"); } sfx("fall"); wait = 300;
    setTimeout(() => { if (V.b !== b) return; b.A = b.A.filter(x => !x.dead); b.B = b.B.filter(x => !x.dead); if (!b.done) drawBattle(); }, 280 / b.speed); }
  else if (e.t === "revive") { const src = b.out.sim.ev[0], o = src.a.concat(src.b).find(x => x.uid === e.d); if (o) { const v = Object.assign({}, o, { hp: e.hp, cover: 0, burn: 0, sup: 0 }); (e.d[0] === "a" ? b.A : b.B).push(v); }
    setTimeout(() => { if (V.b === b && !b.done) { drawBattle(); floatOn(e.d, t("ბრუნდება!", "Returns!"), "note"); } }, 300 / b.speed); sfx("heal"); wait = 650; }
  else if (e.t === "stub") { const v = find(e.d); if (v) v.hp = 1; softSync(); floatOn(e.d, L2([TL.KW.stubborn.ka, TL.KW.stubborn.en]) + "!", "note"); wait = 380; }
  else if (e.t === "buff") { floatOn(e.d, e.k === "brother" ? "+1/+1" : "+1 ⚔", "note"); wait = 200; }
  else if (e.t === "heal") { const v = find(e.d); if (v) v.hp += e.n; softSync(); floatOn(e.d, "+" + e.n, "heal"); sfx("heal"); wait = 240; }
  else if (e.t === "fx") { floatOn(e.d, "◈ +", "block"); wait = 200; }

    const pending = b.A.concat(b.B).some(x => x.dead); const fn = () => { if (V.b !== b) return; b.A = ap(b.A, e.a); b.B = ap(b.B, e.b); if (!b.done) drawBattle(); };

function softSync() {                                // რიცხვების განახლება ანიმაციის შეუწყვეტლად

function openDlg(html) { $("dlg").innerHTML = html; $("ov").hidden = false; }

function newRun(o) { R = TL.newRun(o); prevStats = Object.assign({}, R.stats); V.up = null; V.b = null; go(); }
function selectOwn(u) {

  else V.sel = s && s.u === u ? null : { k: "unit", u };

function swap(u, zone, idx) {                        // ორი ბარათის ადგილების გაცვლა ან ცარიელ ადგილზე გადასვლა
  const x = TL.find(R, u); if (!x) return; const arr = zone === "line" ? R.line : R.res, from = R.line.includes(x) ? R.line : R.res, fi = from.indexOf(x), y = arr[idx];
  if (y && y !== x) { arr[idx] = x; from[fi] = y; } else if (!y) TL.place(R, u, zone, idx);
}

  ac();

    case "home": V.screen = "home"; V.sel = null; break;
    case "sound": SOUND = !SOUND; store.set("tl-sound", SOUND); if (SOUND) sfx("click"); break;
    case "rules": openDlg(rulesHtml()); return;
    case "close": $("ov").hidden = true; return;

    case "resume": if (V.b && !V.b.done) { V.screen = "battle"; break; } return go();

    case "pickf": V.pick = el.dataset.f; V.diff = Math.min(V.diff, M.maxDiff[V.pick] || 0); V.sel = null; break;
    case "diff": V.diff = +el.dataset.d; break;
    case "start": sfx("merge"); return newRun({ faction: V.pick, diff: V.diff });
    case "daily": { const d = TL.dailySeed(today()); sfx("merge"); return newRun({ faction: d.faction, seed: d.seed, daily: d.date, diff: 0 }); }
    case "meta": V.screen = "meta"; break;
    case "codex": V.screen = "codex"; V.sel = null; break;
    case "codexf": V.codex = el.dataset.f; V.sel = null; break;
    case "wipe": if (confirm(t("წავშალო მთელი წინსვლა?", "Erase all progress?"))) { store.del("tl-meta"); store.del("tl-run"); M = loadMeta(); R = null; V.screen = "home"; } break;
    case "peek": V.sel = { k: "peek", id: el.dataset.id, st: Math.max(1, M.seen[el.dataset.id] || 1) }; break;
    case "enter": if (TL.enter(R, i)) { sfx("click"); return go(); } break;
    case "info": V.sel = V.sel && V.sel.u === +el.dataset.u ? null : { k: "unit", u: +el.dataset.u }; break;
    case "einfo": V.sel = { k: "enemy", i }; break;
    case "binfo": V.sel = { k: "bunit", uid: el.dataset.uid }; { const d = $("detail"); if (d) d.outerHTML = detailPanel(); } return;
    case "relic": V.sel = { k: "relic", key: el.dataset.k }; break;
    case "unit": selectOwn(+el.dataset.u); break;
    case "slot": if (V.sel && V.sel.k === "unit") { swap(V.sel.u, el.dataset.z, i); V.sel = null; sfx("click"); } break;
    case "offer": V.sel = { k: "offer", i }; break;
    case "shopord": V.sel = { k: "shopord" }; break;
    case "order": V.sel = { k: "order", i }; TL.toggleOrder(R, i); sfx("click"); break;
    case "useord": TL.toggleOrder(R, i); sfx("click"); break;
    case "buy": { const r = TL.buy(R, i); if (r) { sfx(r.merged ? "merge" : "buy"); if (r.merged) toast(t("შერწყმა! სამი ერთნაირი ერთ გაძლიერებულ იუნიტად იქცა.", "Merged! Three of a kind became one stronger unit.")); V.sel = null; } break; }
    case "lock": TL.toggleLock(R, i); break;
    case "buyord": if (TL.buyOrder(R)) { sfx("buy"); V.sel = null; } break;
    case "sell": if (TL.sell(R, +el.dataset.u)) { sfx("sell"); V.sel = null; } break;
    case "reroll": if (TL.reroll(R)) { sfx("roll"); if (V.sel && (V.sel.k === "offer" || V.sel.k === "shopord")) V.sel = null; } break;
    case "fight": M.tut.prep1 = M.tut.prep2 = 1; return startBattle();

    case "skip": V.b.skip = true; stepBattle(); return;
    case "bnext": V.b = null; return go();
    case "relicpick": if (TL.takeRelic(R, i)) { sfx("merge"); return go(); } break;
    case "rpick": { const before = R.stats.merges; if (TL.takePick(R, i)) { sfx(R.stats.merges > before ? "merge" : "buy"); return go(); } break; }
    case "event": { const r = TL.chooseEvent(R, i); if (r) { sfx("click");
      if (r.unit) toast(nm(TL.def(r.unit)) + " ✓"); else if (r.order) toast(nm(D.common[r.order]) + " ✓"); else if (r.relic) toast(L2(TL.REL[r.relic]) + ": " + L2(TL.REL[r.relic].slice(2)));
      else if (r.good === true) toast(t("ურემი შენია: +6 მარაგი.", "The cart is yours: +6 supply.")); else if (r.good === false) toast(t("ნაღმი. −2 ნებისყოფა.", "A mine. −2 nerve."));
      return go(); } break; }
    case "rest": if (TL.campRest(R)) { sfx("heal"); return go(); } break;
