  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); src.buffer = buf; f.type = filt; f.frequency.value = freq; g.gain.value = vol; src.connect(f).connect(g).connect(a.destination); src.start(t0); }

const KIND = { melee: ["melee", 1], charge: ["melee", 1], venge: ["shot", 0], raid: ["melee", 1], air: ["shot", 1], support: ["shot", 0], scout: ["shot", 0], aa: ["shot", 0], barrage: ["blast", 0], coil: ["blast", 0], quake: ["blast", 0], nest: ["shot", 0], tower: ["shot", 0], burn: ["burn", 0], gas: ["burn", 0], frost: ["burn", 0], fatigue: ["burn", 0] };
const KMSG = { charge: ["იერიში!", "Charge!"], open: ["გახსნის ცეცხლი", "Opening fire"], barrage: ["არტილერია", "Artillery"], quake: ["გოლიათი წინ გადის", "The giant steps forward"], gas: ["გაზი", "Gas"], frost: ["ყინვა", "Frost"], fatigue: ["გამოფიტვა", "Exhaustion"], burn: ["ცეცხლი", "Fire"], support: ["ზურგის ცეცხლი", "Fire from the rear"], air: ["ჰაერიდან", "From the air"] };
function startBattle() {
  const foe = R.enemy.f, ter = R.ter, wasElite = R.enemy.elite, out = TL.fight(R); if (!out) return;
  V.b = { out, ev: out.sim.ev, i: 0, st: { a: { t: [], r: [] }, b: { t: [], r: [] } }, round: 0, speed: M.speed || 1, done: false, skip: false, msg: "", foe, ter, elite: wasElite };
  V.screen = "battle"; V.sel = null; closeSheet(); render(); window.scrollTo(0, 0); setTimeout(stepBattle, 350);
}
function drawBattle() {
  const b = V.b; if (!$("bAt")) return;
  const row = arr => arr.map(x => card(x, { data: `data-act="binfo" data-buid="${x.uid}"`, cls: x.dead ? "dead" : "" })).join("");
  $("bAt").innerHTML = row(b.st.a.t); $("bAr").innerHTML = row(b.st.a.r); $("bBt").innerHTML = row(b.st.b.t); $("bBr").innerHTML = row(b.st.b.r);
  $("bmsg").textContent = b.msg;
  const o = b.out;
  $("bctl").innerHTML = b.done
    ? `<span class="result ${o.result === "win" ? "ok" : o.result === "lose" ? "bad" : ""}" style="grid-column:1/3;align-self:center;color:${o.result === "win" ? "#bcd59b" : o.result === "lose" ? "#f0a898" : "var(--paper)"}">${o.result === "win" ? t("გამარჯვება! ✪", "Victory! ✪") : o.result === "lose" ? t("მარცხი · −1 ♥", "Defeat · −1 ♥") + (o.saved ? " · " + t("ცოცხალი წყალი", "Water of Life") : "") : t("ფრე", "Draw")}</span>
       <button class="btn go" data-act="bnext">${t("გაგრძელება", "Continue")}</button>`
    : `<span style="display:flex;gap:4px">${[1, 2, 4].map(s => `<button class="btn sm ${b.speed === s ? "go" : ""}" data-act="speed" data-s="${s}">${s}×</button>`).join("")}</span><span></span><button class="btn" data-act="skip">${t("გამოტოვება", "Skip")} ⏭</button>`;
}
const bel = uid => document.querySelector(`[data-buid="${uid}"]`);
const bfind = uid => { const s = V.b.st; return s.a.t.concat(s.a.r, s.b.t, s.b.r).find(x => x.uid === uid); };
function floatOn(uid, text, cls) { if (V.b.skip || REDUCED) return; const el = bel(uid); if (!el) return; const f = document.createElement("span"); f.className = "float " + (cls || ""); f.textContent = text; el.appendChild(f);
  f.animate([{ transform: "translate(-50%,0)", opacity: 1 }, { transform: "translate(-50%,-34px)", opacity: 0 }], { duration: 750, easing: "ease-out" }).onfinish = () => f.remove(); }
function lunge(src, dst, far) { if (V.b.skip || REDUCED) return; const a = bel(src), d = bel(dst); if (!a || !d) return; const ra = a.getBoundingClientRect(), rd = d.getBoundingClientRect(), k = far ? .5 : .12;
  a.style.zIndex = 4; a.animate([{ transform: "none" }, { transform: `translate(${(rd.left - ra.left) * k}px,${(rd.top - ra.top) * k}px) scale(1.1)` }, { transform: "none" }], { duration: 300, easing: "ease-in-out" }).onfinish = () => { a.style.zIndex = ""; }; }
function jolt(uid) { if (V.b.skip || REDUCED) return; const el = bel(uid); if (el) el.animate([{ transform: "none", filter: "brightness(2)" }, { transform: "translateX(-5px)" }, { transform: "translateX(5px)" }, { transform: "none", filter: "none" }], { duration: 260 }); }
function soft() { for (const x of [].concat(V.b.st.a.t, V.b.st.a.r, V.b.st.b.t, V.b.st.b.r)) { const el = bel(x.uid); if (!el) continue; const h = el.querySelector(".hp"); if (h) { h.textContent = Math.max(0, x.hp); h.classList.toggle("hurt", x.hp < x.max); } } }
function stepBattle() {
  const b = V.b; if (!b || b.done || V.screen !== "battle") return;
  let wait = 0; const e = b.ev[b.i++]; if (!e) { b.done = true; drawBattle(); return; }
  if (e.t === "init") { b.st = JSON.parse(JSON.stringify({ a: e.a, b: e.b })); b.msg = L2(TL.TER[e.terrain]); drawBattle(); wait = 550; }
  else if (e.t === "phase") { if (b.ev[b.i] && b.ev[b.i].t === "hit") { b.msg = L2(KMSG[e.k]); $("bmsg").textContent = b.msg; wait = 260; } }
  else if (e.t === "round") { b.round = e.n; b.msg = t("რაუნდი ", "Round ") + e.n; $("bmsg").textContent = b.msg; wait = 170; }
  else if (e.t === "hit") { const g = [e]; while (b.ev[b.i] && b.ev[b.i].t === "hit" && b.ev[b.i].k === e.k) g.push(b.ev[b.i++]);
    const kd = KIND[e.k] || ["shot", 0]; if (KMSG[e.k]) { b.msg = L2(KMSG[e.k]); $("bmsg").textContent = b.msg; }
    for (const h of g) { const v = bfind(h.d); if (v) { v.hp -= h.n; v.cover = Math.max(0, (v.cover || 0) - h.c); }
      if (h.s) lunge(h.s, h.d, !!kd[1]); jolt(h.d); floatOn(h.d, h.n ? "−" + h.n : "◈", h.n ? "" : "block"); }
    sfx(kd[0]); if ((e.k === "barrage" || e.k === "quake" || e.k === "coil") && !REDUCED && !b.skip) { const st = $("stage"); if (st) { st.classList.remove("shake"); void st.offsetWidth; st.classList.add("shake"); } }
    wait = 430; setTimeout(() => { if (V.b === b && !b.done) soft(); }, 300 / b.speed); }
  else if (e.t === "die") { const ds = [e]; while (b.ev[b.i] && b.ev[b.i].t === "die") ds.push(b.ev[b.i++]);
    for (const d of ds) { const v = bfind(d.d); if (v) v.dead = true; const el = bel(d.d); if (el) el.classList.add("dead"); } sfx("fall"); wait = 320; }
  else if (e.t === "advance") { b.msg = e.side === "a" ? t("შენი ზურგი სანგარში ჩადის!", "Your rear moves into the trench!") : t("მტრის ზურგი სანგარში ჩადის!", "The enemy rear moves into the trench!"); $("bmsg").textContent = b.msg; wait = 420; }
  else if (e.t === "revive") { sfx("heal"); wait = 500; setTimeout(() => { if (V.b === b && !b.done) floatOn(e.d, t("ბრუნდება!", "Returns!"), "note"); }, 380 / b.speed); }
  else if (e.t === "stub") { const v = bfind(e.d); if (v) v.hp = 1; soft(); floatOn(e.d, L2([TL.KW.stubborn.ka, TL.KW.stubborn.en]) + "!", "note"); wait = 380; }
  else if (e.t === "buff") { floatOn(e.d, e.k === "brother" ? "+1/+1" : "+1 ⚔", "note"); wait = 200; }
  else if (e.t === "heal") { const v = bfind(e.d); if (v) v.hp += e.n; soft(); floatOn(e.d, "+" + e.n, "heal"); sfx("heal"); wait = 240; }
  else if (e.t === "fx") { floatOn(e.d, "◈ +", "block"); wait = 200; }
  else if (e.t === "quake") { wait = 120; }
  else if (e.t === "sync") { const pend = [].concat(b.st.a.t, b.st.a.r, b.st.b.t, b.st.b.r).some(x => x.dead);
    const fn = () => { if (V.b !== b) return; b.st = JSON.parse(JSON.stringify({ a: e.a, b: e.b })); if (!b.done) drawBattle(); };
    if (pend && !b.skip) setTimeout(fn, 280 / b.speed); else fn(); wait = 60; }
  else if (e.t === "end") { b.done = true; const o = b.out; b.msg = o.result === "win" ? t("მტრის რიგი გატყდა", "The enemy line is broken") : o.result === "lose" ? t("შენი რიგი გატყდა", "Your line is broken") : t("ორივე რიგი დაეცა", "Both lines fell");
    setTimeout(() => { if (V.b === b) { drawBattle(); sfx(o.result === "win" ? "win" : o.result === "lose" ? "lose" : "fall"); } }, b.skip ? 0 : 320); return; }
  if (b.skip) return stepBattle();
  setTimeout(stepBattle, wait / b.speed);
}

function newRun(o) { R = TL.newRun(o); prev = Object.assign({}, R.stats); V.up = null; V.b = null; go(); }
function after(r, okMsg) { if (r && r.merged) { sfx("merge"); toast(t("სამეული! ★★ — აირჩიე ბარათი შემდეგი დონიდან.", "A triple! ★★ — choose a card from the next level.")); } else sfx("buy");
  if (r && r.order) toast(t("ბრძანება: ", "Order: ") + nm(TL.ITEMS[r.order])); if (r && r.gifts && r.gifts.length) toast(t("ალქიმია: ორ იუნიტს +1/+1", "Alchemy: two units get +1/+1")); }
function tapOwn(u) {
  const s = V.sel, x = TL.find(R, u);
  if (s && s.k === "own" && s.u !== u) { TL.move(R, s.u, zoneOf(x), (zoneOf(x) === "t" ? R.board.t : zoneOf(x) === "r" ? R.board.r : R.bench).indexOf(x)); sfx("click"); closeSheet(); return; }
  if (s && s.k === "item" && TL.ITEMS[R.shop.items[s.i].key].kind === "unit") { if (TL.buyItem(R, s.i, u)) { sfx("merge"); toast(nm(TL.ITEMS[R.shop.items[s.i].key]) + " → " + nm(TL.def(x.id))); } closeSheet(); return; }
  if (s && s.k === "offer" && R.shop.units[s.i].id === x.id) { const r = TL.buy(R, s.i); if (r) after(r); closeSheet(); return; }
  if (s && s.k === "own" && s.u === u) { closeSheet(); return; }
  V.sel = { k: "own", u }; ownSheet(x);
}
document.addEventListener("click", ev => {
  const lb = ev.target.closest("[data-lang]"); if (lb) { LANG = lb.dataset.lang; store.set("tl-lang", LANG); closeSheet(); V.sel = null; render(); if (!$("ov").hidden) $("dlg").innerHTML = rulesHtml(); return; }
  if (ev.target === $("ov")) { $("ov").hidden = true; return; }
  const el = ev.target.closest("[data-act]");
  if (!el) { if (!$("sheet").hidden && !ev.target.closest("#sheet") && !(R && R.pending && R.pending.length && V.screen === "run")) { closeSheet(); render(); } return; }
  const a = el.dataset.act, i = +el.dataset.i; ac();
  switch (a) {
    case "home": V.screen = "home"; closeSheet(); break;
    case "sound": SOUND = !SOUND; store.set("tl-sound", SOUND); if (SOUND) sfx("click"); break;
    case "rules": $("dlg").innerHTML = rulesHtml(); $("ov").hidden = false; return;
    case "closedlg": $("ov").hidden = true; return;
    case "close": closeSheet(); break;
    case "tip": M.tut[el.dataset.k] = 1; saveMeta(); break;
    case "resume": if (V.b && !V.b.done) { V.screen = "battle"; break; } return go();
    case "pick": V.screen = "pick"; closeSheet(); if (!M.unlocked.includes(V.pick)) V.pick = M.unlocked[0]; break;
    case "pickf": V.pick = el.dataset.f; V.diff = Math.min(V.diff, M.maxDiff[V.pick] || 0); break;
    case "diff": V.diff = +el.dataset.d; break;
    case "start": sfx("merge"); return newRun({ faction: V.pick, diff: V.diff });
    case "daily": { const d = TL.dailySeed(today()); sfx("merge"); return newRun({ faction: d.faction, seed: d.seed, daily: d.date, diff: 0 }); }
    case "meta": V.screen = "meta"; break;
    case "codex": V.screen = "codex"; break;
    case "codexf": V.codex = el.dataset.f; break;
    case "wipe": if (confirm(t("წავშალო მთელი წინსვლა?", "Erase all progress?"))) { store.del("tl-meta"); store.del("tl-run"); M = loadMeta(); R = null; V.screen = "home"; } break;
    case "peek": openSheet(unitInfo({ id: el.dataset.id, st: Math.max(1, M.seen[el.dataset.id] || 1) })); return;
    case "info": { const x = TL.find(R, +el.dataset.u); if (x) openSheet(unitInfo(x)); return; }
    case "foe": foeSheet(); return;
    case "einfo": { const x = R.enemy[el.dataset.z][i]; if (x) openSheet(unitInfo(x, `<div class="acts"><button class="btn out sm" data-act="foe">← ${t("მტრის ჯარი", "Enemy army")}</button></div>`)); return; }
    case "binfo": { const x = bfind(el.dataset.buid); if (x) openSheet(unitInfo(x)); return; }
    case "own": tapOwn(+el.dataset.u); break;
    case "slot": { const s = V.sel;
      if (s && s.k === "own") { TL.move(R, s.u, el.dataset.z, i); sfx("click"); closeSheet(); }
      else if (s && s.k === "offer") { const r = TL.buy(R, s.i, el.dataset.z, i); if (r) after(r); closeSheet(); }
      break; }
    case "offer": if (R.shop.units[i].sold) break; V.sel = { k: "offer", i }; render(); offerSheet(i); return;
    case "item": if (R.shop.items[i].sold) break; V.sel = { k: "item", i }; render(); itemSheet(i); return;
    case "buy": { const r = TL.buy(R, i); if (r) after(r); closeSheet(); break; }
    case "useitem": if (TL.buyItem(R, i)) { sfx("merge"); toast(nm(TL.ITEMS[R.shop.items[i].key]) + " ✓"); } closeSheet(); break;
    case "hold": TL.hold(R, "unit", i); closeSheet(); break;
    case "holdi": TL.hold(R, "item", i); closeSheet(); break;
    case "sell": if (TL.sell(R, +el.dataset.u)) sfx("sell"); closeSheet(); break;
    case "disc": if (TL.takeDiscover(R, i)) { sfx(i >= 0 ? "buy" : "sell"); closeSheet(); } break;
    case "reroll": if (TL.reroll(R)) { sfx("roll"); closeSheet(); } break;
    case "levelup": if (TL.levelUp(R)) { sfx("up"); toast(t("მაღაზიის დონე ", "Muster level ") + ROMAN[R.lvl] + t(": ახალი ბარათები.", ": new cards.")); } break;
    case "fight": M.tut.p1 = 1; return startBattle();
    case "speed": V.b.speed = +el.dataset.s; M.speed = V.b.speed; saveMeta(); drawBattle(); return;
    case "skip": V.b.skip = true; stepBattle(); return;
    case "bnext": V.b = null; return go();
    case "node": if (TL.choose(R, i)) { sfx("click"); return go(); } break;
    case "relic": if (TL.takeRelic(R, i)) { sfx("merge"); return go(); } break;
    case "rest": if (TL.campRest(R)) { sfx("heal"); return go(); } break;
    case "train": if (R.phase === "camp" && TL.campTrain(R, +el.dataset.u)) { sfx("merge"); toast(t("გაწვრთნილია: +2/+2.", "Drilled: +2/+2.")); return go(); } { const x = TL.find(R, +el.dataset.u); if (x) openSheet(unitInfo(x)); } return;
    case "depot": if (TL.depotTake(R, i)) { sfx("buy"); return go(); } break;
    case "event": { const r = TL.chooseEvent(R, i); if (r) { sfx("click");
      if (r.unit) toast(nm(TL.def(r.unit)) + " ✓"); else if (r.order) toast(t("ბრძანება: ", "Order: ") + nm(TL.ITEMS[r.order])); else if (r.relic) toast(L2(TL.REL[r.relic]) + ": " + L2(TL.REL[r.relic].slice(2)));
      else if (r.good === true) toast(t("ურემი შენია: +6 მარაგი.", "The cart is yours: +6 supply.")); else if (r.good === false) toast(t("ნაღმი. −1 სიცოცხლე.", "A mine. −1 life."));
      return go(); } break; }
  }
  if (R && V.screen === "run") track();
  const keep = !$("sheet").hidden; render(); if (keep && V.sel) { if (V.sel.k === "own") { const x = TL.find(R, V.sel.u); if (x) ownSheet(x); } else if (V.sel.k === "offer") offerSheet(V.sel.i); else if (V.sel.k === "item") itemSheet(V.sel.i); }
});
// გადათრევა კომპიუტერზე: შენი ბარათი ან მაღაზიის ბარათი → ადგილი ან ბარათი
let drag = null;
document.addEventListener("dragstart", ev => { const el = ev.target.closest && ev.target.closest('[data-act="own"],[data-act="offer"]'); if (!el) return;
  drag = el.dataset.act === "own" ? { k: "own", u: +el.dataset.u } : { k: "offer", i: +el.dataset.i }; ev.dataTransfer.effectAllowed = "move"; try { ev.dataTransfer.setData("text/plain", "x"); } catch (e) {} });
document.addEventListener("dragover", ev => { if (drag && ev.target.closest('[data-act="own"],[data-act="slot"]')) ev.preventDefault(); });
document.addEventListener("drop", ev => { if (!drag) return; const el = ev.target.closest('[data-act="own"],[data-act="slot"]'); if (!el) { drag = null; return; } ev.preventDefault();
  if (el.dataset.act === "slot") { if (drag.k === "own") TL.move(R, drag.u, el.dataset.z, +el.dataset.i); else { const r = TL.buy(R, drag.i, el.dataset.z, +el.dataset.i); if (r) after(r); } }
  else { V.sel = drag; tapOwn(+el.dataset.u); }
  drag = null; V.sel = null; closeSheet(); sfx("click"); track(); render(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape") { $("ov").hidden = true; if (!(R && R.pending && R.pending.length)) { closeSheet(); render(); } } });
window.__tl = { TL, get R() { return R; }, get M() { return M; }, get V() { return V; }, render, go, newRun };
render();
</script>
